<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Sakura & Exploding Waves</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-index: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #fed6e3 0%, #a881af 100%);
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Ambient overlay to soften the visuals */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.1) 100%);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Interaction state
        const mouse = {
            x: null,
            y: null,
            radius: 120 // Distance required to trigger the explosion
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initWaves();
        });

        // --- Wave Particle System ---
        class WavePoint {
            constructor(x, baseY, amplitude, frequency, phase) {
                this.x = x;
                this.baseY = baseY;
                this.y = baseY;
                this.amplitude = amplitude;
                this.frequency = frequency;
                this.phase = phase;
                
                // For explosion mechanics
                this.vx = 0;
                this.vy = 0;
                this.isExploded = false;
                this.alpha = 1;
                this.originalX = x;
            }

            update(time) {
                if (!this.isExploded) {
                    // Normal wave math (sine wave oscillation)
                    this.y = this.baseY + Math.sin(this.x * this.frequency + time + this.phase) * this.amplitude;
                    
                    // Check distance to mouse
                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = this.x - mouse.x;
                        const dy = this.y - mouse.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < mouse.radius) {
                            this.isExploded = true;
                            // Blast velocity away from mouse
                            const angle = Math.atan2(dy, dx);
                            const force = (mouse.radius - distance) / mouse.radius * 8; // explosion force
                            this.vx = Math.cos(angle) * force + (Math.random() - 0.5) * 2;
                            this.vy = Math.sin(angle) * force + (Math.random() - 0.5) * 2;
                        }
                    }
                } else {
                    // Exploded particle behavior
                    this.x += this.vx;
                    this.y += this.vy;
                    // Add slight gravity / drift
                    this.vy += 0.05; 
                    this.vx *= 0.98; // Friction
                    this.alpha -= 0.015; // Fade out

                    // Regenerate point if it completely fades out
                    if (this.alpha <= 0) {
                        this.reset();
                    }
                }
            }

            reset() {
                this.x = this.originalX;
                this.y = this.baseY;
                this.vx = 0;
                this.vy = 0;
                this.isExploded = false;
                this.alpha = 1;
            }
        }

        let waves = [];
        const numWaves = 4;

        function initWaves() {
            waves = [];
            for (let i = 0; i < numWaves; i++) {
                const wavePoints = [];
                // Dynamic spacing based on screen size
                const step = Math.ceil(width / 120); 
                const baseY = height * 0.5 + (i * 60) - (numWaves * 20); // Stack them beautifully
                const amplitude = 30 + (i * 10);
                const frequency = 0.004 - (i * 0.0005);
                const phase = i * Math.PI / 4;

                for (let x = 0; x <= width + step; x += step) {
                    wavePoints.push(new WavePoint(x, baseY, amplitude, frequency, phase));
                }
                waves.push(wavePoints);
            }
        }

        // --- Background Sakura Branch Drawer ---
        function drawSakuraBranches() {
            ctx.save();
            // Subdued dark-purple tone for silhouettes
            ctx.strokeStyle = "rgba(45, 25, 40, 0.8)"; 
            ctx.fillStyle = "rgba(255, 183, 197, 0.9)"; // Beautiful pink cherry blossom fill

            // Branch 1 (Top Left)
            drawBranch(0, 0, 120, -Math.PI / 4, 12, 5);
            // Branch 2 (Bottom Right)
            drawBranch(width, height * 0.8, 100, Math.PI * 0.8, 10, 4);

            ctx.restore();
        }

        function drawBranch(x, y, length, angle, thickness, depth) {
            if (depth === 0) return;

            const endX = x + Math.cos(angle) * length;
            const endY = y + Math.sin(angle) * length;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(endX, endY);
            ctx.lineWidth = thickness;
            ctx.lineCap = "round";
            ctx.stroke();

            // Draw blossoms on smaller branches
            if (depth < 4) {
                const numBlossoms = Math.floor(Math.random() * 3) + 2;
                for (let i = 0; i < numBlossoms; i++) {
                    const bx = x + Math.cos(angle) * (length * Math.random());
                    const by = y + Math.sin(angle) * (length * Math.random());
                    drawBlossom(bx, by);
                }
            }

            // Sub-branches
            const subBranches = Math.random() > 0.2 ? 2 : 1;
            for (let i = 0; i < subBranches; i++) {
                const newAngle = angle + (Math.random() - 0.5) * 0.6;
                const newLength = length * (0.7 + Math.random() * 0.2);
                drawBranch(endX, endY, newLength, newAngle, thickness * 0.7, depth - 1);
            }
        }

        function drawBlossom(x, y) {
            ctx.beginPath();
            // Simplified beautiful 5-petal look using arcs
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();
            // Center core node
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#e05275";
            ctx.fill();
            ctx.fillStyle = "rgba(255, 183, 197, 0.9)"; // Reset back to petal color
        }


        // --- Core Animation Loop ---
        let time = 0;

        function animate() {
            // Semi-transparent background clear produces a subtle, gorgeous motion trail
            ctx.fillStyle = 'rgba(254, 214, 227, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            // 1. Draw static/semi-static background elements first
            drawSakuraBranches();

            // 2. Update and Draw Waves
            time += 0.02; // Global speed of oscillation

            waves.forEach((wavePoints, waveIndex) => {
                ctx.beginPath();
                
                // Set unique alpha and styles for layers to give depth
                const baseAlpha = 0.3 + (waveIndex * 0.15);
                
                // Draw connecting segments or individual particles depending on explosion state
                for (let i = 0; i < wavePoints.length; i++) {
                    const p = wavePoints[i];
                    p.update(time);

                    if (p.isExploded) {
                        // Render individual exploding particles
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 3 + waveIndex, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * baseAlpha})`;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = "#ffffff";
                        ctx.fill();
                        ctx.restore();
                    } else {
                        // Construct line string for unexploded intact segments
                        if (i === 0 || wavePoints[i-1].isExploded) {
                            ctx.moveTo(p.x, p.y);
                        } else {
                            // Curve to make it ultra-smooth
                            const xc = (p.x + wavePoints[i - 1].x) / 2;
                            const yc = (p.y + wavePoints[i - 1].y) / 2;
                            ctx.quadraticCurveTo(wavePoints[i - 1].x, wavePoints[i - 1].y, xc, yc);
                        }
                    }
                }

                ctx.lineWidth = 3.5 + waveIndex;
                ctx.strokeStyle = `rgba(255, 255, 255, ${baseAlpha})`;
                ctx.lineCap = "round";
                ctx.stroke();
            });

            requestAnimationFrame(animate);
        }

        // Initialize and fire up the loop
        initWaves();
        animate();
    </script>
</body>
</html>
