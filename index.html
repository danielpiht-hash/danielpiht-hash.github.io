<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscillating Waves Interaction</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117; /* GitHub dark theme background */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="waveCanvas"></canvas>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = 'https://ai-art-generator.s3.us-east-1.amazonaws.com/image_3.png'; // Reference to your provided image
        
        let width, height;
        const waves = [];
        const numWaves = 3;
        let particles = [];
        const maxParticles = 1000;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            waves.length = 0;
            for (let i = 0; i < numWaves; i++) {
                waves.push({
                    y: height * (0.4 + i * 0.2),
                    amplitude: height * 0.05 + i * 10,
                    frequency: 0.005 + i * 0.001,
                    speed: 0.02 + i * 0.005,
                    opacity: 0.7 - i * 0.1,
                    width: 2 + i * 1
                });
            }
        }

        function drawWaves(time) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${waves[0].opacity})`;
            ctx.lineWidth = waves[0].width;

            for (let i = 0; i < numWaves; i++) {
                const wave = waves[i];
                ctx.beginPath();
                for (let x = 0; x < width; x++) {
                    const y = wave.y + Math.sin(x * wave.frequency + time * wave.speed) * wave.amplitude;
                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }
        }

        function spawnParticles(x, y) {
            if (!img.complete) return;

            const spawnRadius = 150;
            const sourceRadius = img.width / 4; 
            const sourceX = (x / width) * img.width - sourceRadius / 2;
            const sourceY = (y / height) * img.height - sourceRadius / 2;

            for (let i = 0; i < 50; i++) {
                if (particles.length >= maxParticles) return;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * spawnRadius;
                const vx = Math.cos(angle) * (Math.random() * 5 + 1);
                const vy = Math.sin(angle) * (Math.random() * 5 + 1);

                const px = x + Math.cos(angle) * (distance);
                const py = y + Math.sin(angle) * (distance);
                
                const sx = sourceX + Math.random() * sourceRadius;
                const sy = sourceY + Math.random() * sourceRadius;

                particles.push({
                    x: px, y: py,
                    sx, sy,
                    sw: sourceRadius / 5, sh: sourceRadius / 5,
                    vx, vy,
                    alpha: 1,
                    life: Math.random() * 50 + 20
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                ctx.save();
                ctx.globalAlpha = p.alpha;
                
                // Draw a small chunk of the source image
                if (img.complete) {
                    try {
                        ctx.drawImage(img, p.sx, p.sy, p.sw, p.sh, p.x - 2, p.y - 2, 4, 4);
                    } catch (e) {
                        // Small particles from a small source might draw 0 width/height sometimes,
                        // this catch ignores those cases.
                    }
                }
                ctx.restore();

                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98; // Add friction
                p.vy *= 0.98;
                p.life--;
                p.alpha = Math.max(0, p.life / 70); // Fade out

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        let time = 0;
        function animate() {
            ctx.fillStyle = '#0d1117'; // Keep background
            ctx.fillRect(0, 0, width, height);

            time += 1;
            drawWaves(time);
            drawParticles();

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        
        // Spawn particles on hover
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            spawnParticles(x, y);
        });

        init();
        img.onload = animate; // Start only when image loads
    </script>
</body>
</html>
