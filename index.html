<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Music Visualizer Waves</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #fce4ec 0%, #f3e5f5 50%, #ab47bc 100%);
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.15) 100%);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mouse = {
            x: null,
            y: null,
            radius: 100 
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initWaves();
        });

        // --- Music Wave Bar Component ---
        class MusicBar {
            constructor(x, baseY, amplitude, frequency, phase, barWidth) {
                this.x = x;
                this.baseY = baseY;
                this.y = baseY;
                this.amplitude = amplitude;
                this.frequency = frequency;
                this.phase = phase;
                this.barWidth = barWidth;
                
                // Randomly assign a music note shape type to this column if it explodes
                this.noteType = Math.floor(Math.random() * 3); // 0: Eighth note, 1: Quarter note, 2: Audio block
                
                // Physics
                this.vx = 0;
                this.vy = 0;
                this.isExploded = false;
                this.alpha = 1;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
                this.originalX = x;
            }

            update(time) {
                // Calculate current standard wave height (resembling music frequency bars)
                const targetY = this.baseY - Math.abs(Math.sin(this.x * this.frequency + time + this.phase)) * this.amplitude;

                if (!this.isExploded) {
                    this.y = targetY;

                    // Mouse collision check
                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = this.x - mouse.x;
                        const dy = this.y - mouse.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < mouse.radius) {
                            this.isExploded = true;
                            const angle = Math.atan2(dy, dx);
                            const force = (mouse.radius - distance) / mouse.radius * 12;
                            this.vx = Math.cos(angle) * force + (Math.random() - 0.5) * 4;
                            this.vy = Math.sin(angle) * force - (Math.random() * 4); // Pop upwards slightly
                        }
                    }
                } else {
                    // Exploded Particle/Note behavior
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.15; // Gravity pull down
                    this.vx *= 0.97; // Friction
                    this.rotation += this.rotSpeed;
                    this.alpha -= 0.012;

                    if (this.alpha <= 0) {
                        this.reset();
                    }
                }
            }

            draw(ctx, waveIndex) {
                const baseAlpha = 0.4 + (waveIndex * 0.2);
                ctx.save();

                if (!this.isExploded) {
                    // Draw digital audio visualizer equalizer bars going downward to base height
                    ctx.fillStyle = `rgba(255, 255, 255, ${baseAlpha})`;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "#ffffff";
                    
                    // Draw equalizer pillar
                    ctx.fillRect(this.x - this.barWidth/2, this.y, this.barWidth, this.baseY - this.y);
                    
                    // Draw a small "peak dot" cap above the music bar
                    ctx.fillRect(this.x - this.barWidth/2, this.y - 4, this.barWidth, 2);
                } else {
                    // Draw the exploded music notes rotating through the air
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * baseAlpha})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "#fff";

                    if (this.noteType === 0) {
                        // Draw Eighth Note (♫ style)
                        ctx.beginPath();
                        ctx.arc(0, 0, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillRect(2, -12, 2, 12);
                        ctx.fillRect(2, -12, 6, 2);
                    } else if (this.noteType === 1) {
                        // Draw Quarter Note (♩ style)
                        ctx.beginPath();
                        ctx.arc(0, 0, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillRect(2, -12, 2, 12);
                    } else {
                        // Draw Floating Audio Block fragment
                        ctx.fillRect(-4, -4, 8, 8);
                    }
                }
                ctx.restore();
            }

            reset() {
                this.x = this.originalX;
                this.isExploded = false;
                this.alpha = 1;
                this.vx = 0;
                this.vy = 0;
                this.rotation = 0;
            }
        }

        let waveLayers = [];
        const numWaves = 3;

        function initWaves() {
            waveLayers = [];
            const barWidth = 6;
            const gap = 4;
            const totalBarSpace = barWidth + gap;

            for (let i = 0; i < numWaves; i++) {
                const bars = [];
                // Set layers at different steady baselines across lower half
                const安排Y = height * 0.6 + (i * 55); 
                const amplitude = 50 + (i * 35);
                const frequency = 0.005 - (i * 0.001);
                const phase = i * (Math.PI / 3);

                for (let x = totalBarSpace; x < width; x += totalBarSpace) {
                    bars.push(new MusicBar(x,安排Y, amplitude, frequency, phase, barWidth));
                }
                waveLayers.push(bars);
            }
        }

        // --- Background Sakura Trees ---
        function drawSakuraScene() {
            ctx.save();
            ctx.strokeStyle = "rgba(54, 32, 51, 0.75)";
            ctx.fillStyle = "rgba(255, 192, 203, 0.85)";

            // Main Background Branches
            drawBranch(0, height * 0.2, 90, -Math.PI / 6, 10, 5);
            drawBranch(width, height * 0.1, 110, Math.PI * 0.9, 12, 5);
            ctx.restore();
        }

        function drawBranch(x, y, length, angle, thickness, depth) {
            if (depth === 0) return;

            const endX = x + Math.cos(angle) * length;
            const endY = y + Math.sin(angle) * length;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(endX, endY);
            ctx.lineWidth = thickness;
            ctx.lineCap = "round";
            ctx.stroke();

            if (depth < 4) {
                const blossoms = Math.floor(Math.random() * 3) + 2;
                for (let i = 0; i < blossoms; i++) {
                    const bx = x + Math.cos(angle) * (length * Math.random());
                    const by = y + Math.sin(angle) * (length * Math.random());
                    ctx.beginPath();
                    ctx.arc(bx, by, 5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(bx, by, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = "#ff4081";
                    ctx.fill();
                    ctx.fillStyle = "rgba(255, 192, 203, 0.85)";
                }
            }

            const branches = Math.random() > 0.3 ? 2 : 1;
            for (let i = 0; i < branches; i++) {
                const nextAngle = angle + (Math.random() - 0.5) * 0.7;
                const nextLength = length * (0.75 + Math.random() * 0.15);
                drawBranch(endX, endY, nextLength, nextAngle, thickness * 0.65, depth - 1);
            }
        }

        // --- Global Animation Loop ---
        let time = 0;

        function animate() {
            // Keep background trailing smooth
            ctx.fillStyle = 'rgba(252, 228, 236, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // 1. Render Background Sakura
            drawSakuraScene();

            // 2. Render Equalizer Wave Layers
            time += 0.03; // Modulation Speed

            waveLayers.forEach((bars, waveIndex) => {
                bars.forEach(bar => {
                    bar.update(time);
                    bar.draw(ctx, waveIndex);
                });
            });

            requestAnimationFrame(animate);
        }

        initWaves();
        animate();
    </script>
</body>
</html>
