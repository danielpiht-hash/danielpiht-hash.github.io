<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111;
    }

    /* ── Full-screen wallpaper ── */
    #bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%), 
                  url('wallpaper.jpg') no-repeat center center;
      background-size: cover;
      filter: brightness(0.65) blur(2px);
      z-index: 0;
    }

    /* ── Draggable player card ── */
    #player {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 340px;
      border-radius: 24px;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 32px 80px rgba(0,0,0,0.55);
      padding: 28px 28px 24px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #player.dragging { cursor: grabbing; box-shadow: 0 48px 100px rgba(0,0,0,0.70); }

    /* Album art */
    #art-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #1a1a2e;
    }
    #art-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s;
    }
    #art-wrap img.fade-out { opacity: 0; }

    /* Vinyl spin ring animation */
    #vinyl-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.15);
      animation: spin 12s linear infinite;
      animation-play-state: paused;
      pointer-events: none;
    }
    #vinyl-ring.spinning { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Song info */
    #song-title {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #song-artist {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress bar */
    #progress-wrap {
      margin: 16px 0 6px;
      cursor: pointer;
      padding: 4px 0;
    }
    #progress-bg {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      position: relative;
    }
    #progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #a78bfa, #6366f1);
      width: 0%;
    }
    #progress-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      left: 0%;
      transition: transform 0.1s;
    }
    #progress-wrap:hover #progress-thumb {
      transform: translate(-50%, -50%) scale(1.2);
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    /* ── SVG controls ── */
    #controls-svg {
      width: 100%;
      margin-top: 8px;
      overflow: visible;
    }

    .btn-zone {
      cursor: pointer;
      fill: transparent;
      transition: fill 0.15s;
    }
    .btn-zone:hover { fill: rgba(255,255,255,0.08); }
    .btn-zone:active { fill: rgba(255,255,255,0.16); }

    .ctrl-icon { pointer-events: none; fill: rgba(255,255,255,0.9); }
    .ctrl-icon-sm { pointer-events: none; fill: rgba(255,255,255,0.6); }

    /* Volume */
    #vol-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding: 0 4px;
    }
    #vol-wrap svg { flex-shrink: 0; }
    #vol-slider {
      flex: 1;
      accent-color: #a78bfa;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    /* Toast notification */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 20, 25, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 13px;
      padding: 10px 22px;
      border-radius: 50px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 99;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Raining Money Styles ── */
    #money-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      perspective: 1200px;
    }
    .bill {
      position: absolute;
      width: 130px;
      height: 55px;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      transform-style: preserve-3d;
      will-change: transform, top, left;
    }
    .bill-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 2px;
      box-shadow: 0 8px 25px rgba(255, 68, 0, 0.35), 0 2px 5px rgba(0,0,0,0.4);
    }
    .bill-front {
      transform: rotateY(0deg);
    }
    .bill-back {
      transform: rotateY(180deg);
    }
    .bill-shard {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff5500;
      border: 1px solid #3a0e00;
      pointer-events: none;
      will-change: transform, opacity;
      box-shadow: 0 0 8px #ffaa00;
    }
    /* Volumetric combustion engine effects */
    .fire-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      will-change: transform, opacity;
      z-index: 2;
    }
    /* Dynamic heat mirage wave effect behind the bills */
    .heat-mirage {
      position: absolute;
      width: 160px;
      height: 90px;
      pointer-events: none;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border-radius: 50%;
      z-index: 1;
      will-change: transform, opacity;
      opacity: 0.6;
    }
  </style></head><body><div id="bg"></div>

<div id="money-container"></div>

<div id="player">
  <div id="art-wrap">
    <img id="cover-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%231e1b4b'/><circle cx='50' cy='50' r='20' fill='%234338ca'/></svg>" alt="Album Cover" />
    <div id="vinyl-ring"></div>
  </div>

  <div id="song-title">Loading…</div>
  <div id="song-artist">—</div>

  <div id="progress-wrap">
    <div id="progress-bg">
      <div id="progress-fill"></div>
      <div id="progress-thumb"></div>
    </div>
  </div>
  <div class="time-row">
    <span id="time-cur">0:00</span>
    <span id="time-dur">0:00</span>
  </div>

  <svg id="controls-svg" viewBox="0 0 284 60" xmlns="http://www.w3.org/2000/svg">
    <g id="btn-pause1">
      <rect class="btn-zone" x="14" y="8" width="52" height="44" rx="10"/>

    <g id="btn-play">
      <rect class="btn-zone" x="116" y="2" width="52" height="56" rx="14"/>
      <polygon class="ctrl-icon" points="134,18 134,42 154,30" />
    </g>

    <g id="btn-skip">
      <rect class="btn-zone" x="218" y="8" width="52" height="44" rx="10"/>
      <polygon class="ctrl-icon-sm" points="248,20 248,40 232,30"/>
      <rect class="ctrl-icon-sm" x="226" y="20" width="4" height="20" rx="1"/>

  </svg>

  <div id="vol-wrap">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M2 5.5h2.5L8 2.5v11L4.5 10.5H2v-5z" fill="rgba(255,255,255,0.6)"/>
      <path d="M11 5a3.5 3.5 0 0 1 0 6" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8" />
  </div></div><div id="toast"></div><audio id="audio" crossorigin="anonymous"></audio><script>
  // Track Catalog Array
  const SONGS = [
    {
      title: "Hate The Morning",
      artist: "Maxon Margiela",
      cover: "album.jpeg",   
      src:   "maxonmusic.mp3" 
    }
  ];

  /* ── State variables ── */
  let idx = 0;
  let playing = false;

  // DOM Elements
  const audio = document.getElementById('audio');
  const coverImg = document.getElementById('cover-img');
  const songTitle = document.getElementById('song-title');
  const songArtist = document.getElementById('song-artist');
  const progressWrap = document.getElementById('progress-wrap');
  const progressBg = document.getElementById('progress-bg');
  const progressFill = document.getElementById('progress-fill');
  const progressThumb = document.getElementById('progress-thumb');
  const timeCur = document.getElementById('time-cur');
  const timeDur = document.getElementById('time-dur');
  const vinylRing = document.getElementById('vinyl-ring');
  const volSlider = document.getElementById('vol-slider');
  const toast = document.getElementById('toast');
  const player = document.getElementById('player');

  /* ── Notification Management ── */
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  /* ── Time Formatting Utility ── */
  function fmt(s) {
    if (isNaN(s) || s === Infinity) return '0:00';
    const mins = Math.floor(s / 60);
    const secs = Math.floor(s % 60);
    return mins + ':' + String(secs).padStart(2, '0');
  }

  /* ── Music Metadata Management ── */
  function loadSong(i, autoplay) {
    const s = SONGS[i];
    if (!s) return;

    songTitle.textContent = s.title;
    songArtist.textContent = s.artist;
    audio.src = s.src;
    audio.volume = parseFloat(volSlider.value);

    // Fade animation wrapper for Album art changes
    coverImg.classList.add('fade-out');
    setTimeout(() => {
      coverImg.src = s.cover;
      coverImg.onload = () => coverImg.classList.remove('fade-out');
      coverImg.onerror = () => {
        // Fallback transparent/generated placeholder asset vector if resource fails
        coverImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%231e1b4b'/></svg>";
        coverImg.classList.remove('fade-out');
      };
    }, 200);

    // Clear timelines reset layout variables
    progressFill.style.width = '0%';
    progressThumb.style.left = '0%';
    timeCur.textContent = '0:00';
    timeDur.textContent = '0:00';

    if (autoplay) {
      audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
    } else {
      setPlaying(false);
    }
  }

  function setPlaying(state) {
    playing = state;
    if (state) {
      vinylRing.classList.add('spinning');
      updatePlayIcon(true);
    } else {
      vinylRing.classList.remove('spinning');
      updatePlayIcon(false);
    }
  }

  // Dynamic SVG Node updates for switching inner elements
  function updatePlayIcon(isPlaying) {
    const g = document.getElementById('btn-play');
    const oldIcons = g.querySelectorAll('.ctrl-icon');
    oldIcons.forEach(el => el.remove());

    if (isPlaying) {
      // Create SVG Pause Rectangles
      [['132', '6'], ['146', '6']].forEach(([xPos, width]) => {
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'ctrl-icon');
        r.setAttribute('x', xPos);
        r.setAttribute('y', '19'); 
        r.setAttribute('width', width); 
        r.setAttribute('height', '22'); 
        r.setAttribute('rx', '1.5');
        g.appendChild(r);
      });
    } else {
      // Create SVG Play Triangle Polygon
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('class', 'ctrl-icon');
      poly.setAttribute('points', '134,18 134,42 154,30');
      g.appendChild(poly);
    }
  }

  /* ── Interactive Player Controls ── */
  document.getElementById('btn-play').addEventListener('click', () => {
    if (playing) {
      audio.pause();
      setPlaying(false);
      showToast('Paused');
    } else {
      audio.play()
        .then(() => {
          setPlaying(true);
          showToast('Playing');
        })
        .catch(() => showToast('Audio file not found / blocked'));
    }
  });

  document.getElementById('btn-pause1').addEventListener('click', () => {
    if (playing) {
      audio.pause();
      setPlaying(false);
      showToast('Paused');
    }
  });

  document.getElementById('btn-skip').addEventListener('click', () => {
    audio.currentTime = 0; 
    showToast('Track Restarted');
  });

  /* ── Progress Scrub Mechanics ── */
  progressWrap.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progressBg.getBoundingClientRect();
    const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    audio.currentTime = ratio * audio.duration;
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    timeCur.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    timeDur.textContent = fmt(audio.duration);
  });

  audio.addEventListener('ended', () => {
    audio.currentTime = 0;
    setPlaying(false);
    showToast('Track Finished');
  });

  /* ── Volume Handling ── */
  volSlider.addEventListener('input', () => {
    audio.volume = parseFloat(volSlider.value);
  });

  /* ── Strict Container Boundary Card Drag Engine ── */
  let dragActive = false;
  let startX = 0, startY = 0;
  let initialX = 0, initialY = 0;

  player.addEventListener('mousedown', initDrag);
  player.addEventListener('touchstart', initDrag, { passive: true });

  function initDrag(e) {
    if (e.target.closest('.btn-zone, #progress-wrap, #vol-slider')) return;
    
    dragActive = true;
    player.classList.add('dragging');
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const rect = player.getBoundingClientRect();
    initialX = rect.left;
    initialY = rect.top;
    
    startX = clientX;
    startY = clientY;
    
    player.style.transform = 'none';
    player.style.left = initialX + 'px';
    player.style.top = initialY + 'px';
  }

  document.addEventListener('mousemove', performDrag);
  document.addEventListener('touchmove', performDrag, { passive: false });

  function performDrag(e) {
    if (!dragActive) return;
    if (e.cancelable) e.preventDefault();
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const deltaX = clientX - startX;
    const deltaY = clientY - startY;
    
    let targetX = initialX + deltaX;
    let targetY = initialY + deltaY;
    
    const boundX = window.innerWidth - player.offsetWidth;
    const boundY = window.innerHeight - player.offsetHeight;
    
    player.style.left = Math.min(Math.max(0, targetX), boundX) + 'px';
    player.style.top = Math.min(Math.max(0, targetY), boundY) + 'px';
  }

  const terminateDrag = () => { 
    if (dragActive) {
      dragActive = false; 
      player.classList.remove('dragging'); 
    }
  };
  
  document.addEventListener('mouseup', terminateDrag);
  document.addEventListener('touchend', terminateDrag);
  window.addEventListener('resize', () => {
    const rect = player.getBoundingClientRect();
    const boundX = window.innerWidth - player.offsetWidth;
    const boundY = window.innerHeight - player.offsetHeight;
    if (rect.left > boundX) player.style.left = Math.max(0, boundX) + 'px';
    if (rect.top > boundY) player.style.top = Math.max(0, boundY) + 'px';
  });

  /* ── High-Fidelity Raining Money & Volumetric Fire Engine ── */
  const moneyContainer = document.getElementById('money-container');
  
  // High-Fidelity Vector Front with ash layers and integrated feGaussianBlur engine
  const svg100Front = `

        </filter>
        <linearGradient id="char-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#111111" stop-opacity="0.95"/>
          <stop offset="15%" stop-color="#2a1a10" stop-opacity="0.8"/>
          <stop offset="40%" stop-color="#e2ebd5" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <rect width="130" height="55" rx="1.5" fill="#e2ebd5" stroke="#4d5d43" stroke-width="0.8"/>
      <rect x="2" y="2" width="126" height="51" fill="none" stroke="#66795c" stroke-width="0.5" stroke-dasharray="1.5,0.8"/>
      <rect x="76" y="1" width="4.5" height="53" fill="#4d759a" opacity="0.65"/>
      <line x1="78.2" y1="1" x2="78.2" y2="54" stroke="#25435e" stroke-width="0.6" stroke-dasharray="2,3"/>
      <ellipse cx="58" cy="27.5" rx="15" ry="20" fill="#cedcb9" stroke="#5b6e51" stroke-width="0.4"/>
      <ellipse cx="58" cy="27" rx="11" ry="15" fill="#a4bd93" opacity="0.55"/>
      <path d="M 52 35 Q 58 37 64 35 Q 64 24 58 20 Q 52 24 52 35" fill="#405237" opacity="0.45"/>
      <circle cx="96" cy="27" r="6.5" fill="none" stroke="#ad6239" stroke-width="0.6" stroke-dasharray="1,0.5" opacity="0.8"/>
      <text x="6" y="14" font-family="Times New Roman, serif" font-weight="bold" font-size="11" fill="#1e2b19">100</text>
      <text x="108" y="14" font-family="Times New Roman, serif" font-weight="bold" font-size="11" fill="#1e2b19">100</text>

    </svg>
  `;

  const svg100Back = `
    <svg width="100%" height="100%" viewBox="0 0 130 55" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow-fx2" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="char-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#111111" stop-opacity="0.95"/>
          <stop offset="15%" stop-color="#2a1a10" stop-opacity="0.8"/>
          <stop offset="40%" stop-color="#ccd9bd" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <rect width="130" height="55" rx="1.5" fill="#ccd9bd" stroke="#48593e" stroke-width="0.8"/>
      <rect x="2" y="2" width="126" height="51" fill="none" stroke="#526647" stroke-width="0.5" stroke-dasharray="1.5,0.8"/>
      <rect x="35" y="16" width="60" height="24" fill="#a2ba94" stroke="#3d4f34" stroke-width="0.4" opacity="0.85"/>
      <rect x="61" y="8" width="8" height="12" fill="#a2ba94" stroke="#3d4f34" stroke-width="0.4"/>
      <text x="32" y="11" font-family="Times New Roman, serif" font-weight="bold" font-size="5" letter-spacing="0.5" fill="#293822">THE UNITED STATES OF AMERICA</text>
      <text x="44" y="47" font-family="Times New Roman, serif" font-weight="bold" font-size="4.5" letter-spacing="0.1" fill="#293822">ONE HUNDRED DOLLARS</text>
      <text x="6" y="15" font-family="Georgia, serif" font-weight="bold" font-size="11" fill="#435439">100</text>
      <text x="108" y="15" font-family="Georgia, serif" font-weight="bold" font-size="11" fill="#435439">100</text>
      
      <path d="M 0 0 Q 25 15 12 28 T 35 55 L 0 55 Z" fill="url(#char-grad2)"/>
      <path d="M 0 0 Q 25 15 12 28 T 35 55" fill="none" stroke="#ff4500" stroke-width="1.2" filter="url(#glow-fx2)"/>
    </svg>
  `;

  let activeBills = [];

  // Procedural multi-tiered high-realism plasma fire framework
  function spawnHighRealismFlame(billX, billY, rotZ) {
    // Generate individual thermodynamic combustion stages
    const layers = 2; 
    for(let i=0; i<layers; i++) {
      const p = document.createElement('div');
      p.className = 'fire-particle';
      
      const rand = Math.random();
      let size = 12 + Math.random() * 22;
      let bg = '';
      let blur = 'blur(1px)';
      
      // Realist color space ratio mixing core temperature color fields
      if (rand > 0.75) {
        bg = 'radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,230,110,0.9) 40%, rgba(255,100,0,0) 70%)'; // White hot thermal core
      } else if (rand > 0.4) {
        bg = 'radial-gradient(circle, rgba(255,140,0,0.9) 0%, rgba(255,60,0,0.7) 50%, rgba(200,0,0,0) 80%)';   // Kinetic body flame
      } else if (rand > 0.15) {
        bg = 'radial-gradient(circle, rgba(130,50,0,0.6) 0%, rgba(90,20,0,0.4) 40%, rgba(0,0,0,0) 70%)';     // Incandescent amber plume
        blur = 'blur(3px)';
      } else {
        bg = 'radial-gradient(circle, rgba(50,50,50,0.3) 0%, rgba(20,20,20,0.1) 50%, rgba(0,0,0,0) 80%)';     // Thermal cooling soot/smoke
        size = 20 + Math.random() * 25;
        blur = 'blur(5px)';
      }

      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = bg;
      p.style.filter = blur;

      // Project fire coordinates dynamically along the custom charred left axis of the bill
      const angleRad = rotZ * Math.PI / 180;
      const localOffsetX = Math.random() * 30 - 15;
      const localOffsetY = Math.random() * 45 - 22;
      
      const rotatedX = localOffsetX * Math.cos(angleRad) - localOffsetY * Math.sin(angleRad);
      const rotatedY = localOffsetX * Math.sin(angleRad) + localOffsetY * Math.cos(angleRad);

      const startX = billX + 25 + rotatedX;
      const startY = billY + 27 + rotatedY;

      p.style.left = startX + 'px';
      p.style.top = startY + 'px';
      moneyContainer.appendChild(p);

      let curY = startY;
      let curX = startX;
      let op = 1.0;
      let scale = 1.0;
      
      let velY = -1.2 - Math.random() * 2.2; // Upward thermal drafts
      let velX = (Math.random() - 0.5) * 1.2 - (Math.sin(angleRad) * 0.8);

      function animateFlameLayer() {
        curY += velY;
        curX += velX;
        op -= 0.038;
        scale += 0.025; 

        p.style.top = curY + 'px';
        p.style.left = curX + 'px';
        p.style.transform = `scale(${scale})`;
        p.style.opacity = op;

        if (op <= 0) {
          p.remove();
        } else {
          requestAnimationFrame(animateFlameLayer);
        }
      }
      requestAnimationFrame(animateFlameLayer);
    }
  }

  // Generates physical micro refractive mirage lens blocks
  function spawnHeatMirage(x, y) {
    if (Math.random() > 0.25) return;
    const mirage = document.createElement('div');
    mirage.className = 'heat-mirage';
    mirage.style.left = (x - 15) + 'px';
    mirage.style.top = (y - 15) + 'px';
    moneyContainer.appendChild(mirage);

    let op = 0.6;
    let curY = y - 15;
    function animateMirage() {
      curY -= 1.5;
      op -= 0.025;
      mirage.style.top = curY + 'px';
      mirage.style.opacity = op;
      if (op <= 0) {
        mirage.remove();
      } else {
        requestAnimationFrame(animateMirage);
      }
    }
    requestAnimationFrame(animateMirage);
  }

  function spawnBill() {
    if (activeBills.length > 25) return;

    const el = document.createElement('div');
    el.className = 'bill';
    
    el.innerHTML = `
      <div class="bill-face bill-front">${svg100Front}</div>
      <div class="bill-face bill-back">${svg100Back}</div>
    `;

    let xPos = Math.random() * (window.innerWidth - 130);
    let yPos = -60;
    
    let fallSpeed = 1.0 + Math.random() * 1.6; 
    let swaySpeed = 0.008 + Math.random() * 0.014;
    let swayAmount = 25 + Math.random() * 35;
    let rotationSpeedX = (Math.random() - 0.5) * 3; 
    let rotationSpeedY = 1.5 + Math.random() * 3.5;
    
    let seed = Math.random() * 100;
    let rotX = Math.random() * 360;
    let rotY = Math.random() * 360;
    let rotZ = (Math.random() - 0.5) * 35;

    el.style.left = xPos + 'px';
    el.style.top = yPos + 'px';
    moneyContainer.appendChild(el);

    const billObj = {
      element: el,
      x: xPos,
      y: yPos,
      fallSpeed,
      swaySpeed,
      swayAmount,
      rotationSpeedX,
      rotationSpeedY,
      seed,
      rotX,
      rotY,
      rotZ
    };

    el.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      explodeBill(billObj);
    });
    el.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      explodeBill(billObj);
    }, { passive: true });

    activeBills.push(billObj);
  }

  function explodeBill(bill) {
    activeBills = activeBills.filter(b => b !== bill);
    
    const rect = bill.element.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    bill.element.remove();

    const shardCount = 18;
    for (let i = 0; i < shardCount; i++) {
      const shard = document.createElement('div');
      shard.className = 'bill-shard';
      
      // Explodes into white hot / high energy secondary burning cinders
      if (Math.random() > 0.4) shard.style.background = '#ffdd44';
      if (Math.random() > 0.7) shard.style.background = '#ffffff';

      shard.style.left = centerX + 'px';
      shard.style.top = centerY + 'px';
      moneyContainer.appendChild(shard);

      const angle = Math.random() * Math.PI * 2;
      const velocity = 3 + Math.random() * 8;
      let sX = Math.cos(angle) * velocity;
      let sY = Math.sin(angle) * velocity;
      let sRot = Math.random() * 360;
      let sRotSpeed = (Math.random() - 0.5) * 25;
      let opacity = 1;
      let curX = centerX;
      let curY = centerY;

      function updateShard() {
        sY += 0.2; 
        curX += sX;
        curY += sY;
        opacity -= 0.02;
        sRot += sRotSpeed;

        shard.style.left = curX + 'px';
        shard.style.top = curY + 'px';
        shard.style.transform = `rotate(${sRot}deg)`;
        shard.style.opacity = opacity;

        if (opacity <= 0) {
          shard.remove();
        } else {
          requestAnimationFrame(updateShard);
        }
      }
      requestAnimationFrame(updateShard);
    }
  }

  function updateMoneyEngine() {
    for (let i = activeBills.length - 1; i >= 0; i--) {
      const b = activeBills[i];
      b.y += b.fallSpeed;
      b.seed += b.swaySpeed;
      
      const currentX = b.x + Math.sin(b.seed) * b.swayAmount;
      b.rotX += b.rotationSpeedX;
      b.rotY += b.rotationSpeedY;

      b.element.style.top = b.y + 'px';
      b.element.style.left = currentX + 'px';
      b.element.style.transform = `rotateX(${b.rotX}deg) rotateY(${b.rotY}deg) rotateZ(${b.rotZ}deg)`;

      // Continuous thermodynamic ignition cycle calculation loop
      spawnHighRealismFlame(currentX, b.y, b.rotZ);
      spawnHeatMirage(currentX, b.y);

      if (b.y > window.innerHeight + 60) {
        b.element.remove();
        activeBills.splice(i, 1);
      }
    }
    requestAnimationFrame(updateMoneyEngine);
  }

  setInterval(spawnBill, 700);
  requestAnimationFrame(updateMoneyEngine);

  /* ── Initialization ── */
  loadSong(idx, false);
</script></body></html>
