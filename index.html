<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palm Beach Melodies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background-color: white; /* Fallback */
        }

        /* SVG Background Overlay */
        #svg-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            z-index: 0; /* Behind the music waves */
        }
    </style>
</head>
<body>

    <svg id="svg-background" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#a2d9ff;stop-opacity:1" />
            </linearGradient>
            <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#005cbf;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#48d1ff;stop-opacity:1" />
            </linearGradient>
            <clipPath id="palmClip">
                <path d="M0,0 L100,0 L50,100 Z" />
            </clipPath>
        </defs>
        
        <rect width="1000" height="600" fill="url(#skyGradient)" />
        
        <rect x="0" y="240" width="1000" height="40" fill="#000080" />
        
        <rect x="0" y="280" width="1000" height="320" fill="url(#waterGradient)" />
        
        <g fill="white" opacity="0.8">
            <ellipse cx="150" cy="80" rx="60" ry="40" />
            <ellipse cx="210" cy="95" rx="50" ry="35" />
            <ellipse cx="280" cy="70" rx="70" ry="45" />
            
            <ellipse cx="600" cy="110" rx="90" ry="55" />
            <ellipse cx="700" cy="90" rx="80" ry="50" />
            
            <ellipse cx="900" cy="60" rx="60" ry="35" />
            <ellipse cx="840" cy="80" rx="50" ry="30" />
        </g>
        
        <ellipse cx="100" cy="270" rx="100" ry="30" fill="#f5deb3" /> <g transform="translate(40, 160)"> <path d="M10,110 Q15,60 20,10" stroke="#8b4513" stroke-width="4" fill="none" />
            <g transform="translate(20,10) rotate(-40)">
                <ellipse cx="0" cy="0" rx="30" ry="8" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="28" ry="6" fill="#32cd32" />
            </g>
             <g transform="translate(20,10) rotate(0)">
                <ellipse cx="0" cy="0" rx="30" ry="8" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="28" ry="6" fill="#32cd32" />
            </g>
             <g transform="translate(20,10) rotate(40)">
                <ellipse cx="0" cy="0" rx="30" ry="8" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="28" ry="6" fill="#32cd32" />
            </g>
             <g transform="translate(20,10) rotate(80)">
                <ellipse cx="0" cy="0" rx="30" ry="8" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="28" ry="6" fill="#32cd32" />
            </g>
        </g>
        
        <g transform="translate(80, 150)"> <path d="M10,120 Q18,65 25,10" stroke="#8b4513" stroke-width="5" fill="none" />
             <g transform="translate(25,10) rotate(-35)">
                <ellipse cx="0" cy="0" rx="35" ry="9" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="33" ry="7" fill="#32cd32" />
            </g>
             <g transform="translate(25,10) rotate(10)">
                <ellipse cx="0" cy="0" rx="35" ry="9" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="33" ry="7" fill="#32cd32" />
            </g>
             <g transform="translate(25,10) rotate(55)">
                <ellipse cx="0" cy="0" rx="35" ry="9" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="33" ry="7" fill="#32cd32" />
            </g>
             <g transform="translate(25,10) rotate(100)">
                <ellipse cx="0" cy="0" rx="35" ry="9" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="33" ry="7" fill="#32cd32" />
            </g>
        </g>
        
        <g transform="translate(140, 140)"> <path d="M10,130 Q12,70 15,10" stroke="#8b4513" stroke-width="4" fill="none" />
             <g transform="translate(15,10) rotate(-25)">
                <ellipse cx="0" cy="0" rx="25" ry="6" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="23" ry="5" fill="#32cd32" />
            </g>
             <g transform="translate(15,10) rotate(20)">
                <ellipse cx="0" cy="0" rx="25" ry="6" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="23" ry="5" fill="#32cd32" />
            </g>
             <g transform="translate(15,10) rotate(65)">
                <ellipse cx="0" cy="0" rx="25" ry="6" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="23" ry="5" fill="#32cd32" />
            </g>
             <g transform="translate(15,10) rotate(110)">
                <ellipse cx="0" cy="0" rx="25" ry="6" fill="#228b22" />
                <ellipse cx="0" cy="0" rx="23" ry="5" fill="#32cd32" />
            </g>
        </g>

        <circle cx="480" cy="380" r="2" fill="white" opacity="0.7" />
        <circle cx="510" cy="400" r="1.5" fill="white" opacity="0.7" />
        <circle cx="530" cy="370" r="1" fill="white" opacity="0.7" />
    </svg>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Handle resizing
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Mouse tracking
        const mouse = {
            x: null,
            y: null,
            radius: 80 // Hover detection radius
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Musical note symbols to render
        const noteSymbols = ['♪', '♫', '♩', '♬', '♭', '♮', '♯'];

        // Particle Class (for explosions)
        class Particle {
            constructor(x, y, symbol) {
                this.x = x;
                this.y = y;
                this.symbol = symbol;
                this.size = Math.random() * 16 + 12;
                this.speedX = (Math.random() - 0.5) * 10;
                this.speedY = (Math.random() - 0.5) * 10;
                this.gravity = 0.05;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
                this.angle += this.spin;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                // Pure white particles with white glow
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fff';
                ctx.font = `${this.size}px sans-serif`;
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        // Wave Node Class
        class WaveNode {
            constructor(x, y, symbol, baseRowY) {
                this.x = x;
                this.y = y;
                this.baseRowY = baseRowY; // Track its original baseline
                this.symbol = symbol;
                this.size = Math.random() * 14 + 16; // Slightly larger nodes
                this.isExploded = false;
                this.angle = Math.random() * Math.PI;
            }

            update(time, waveIndex) {
                if (this.isExploded) return;

                // Flowing oscillation logic
                // Creates a natural snake/wave movement combining time and x-position
                this.y = this.baseRowY + Math.sin(time * 0.0015 + this.x * 0.006 + waveIndex) * 50;
                
                // Add a gentle floating rotation
                this.angle += 0.008;

                // Check collision with mouse
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        this.explode();
                    }
                }
            }

            explode() {
                this.isExploded = true;
                // Create a burst of smaller debris particles when the node dies
                for (let i = 0; i < 6; i++) {
                    particles.push(new Particle(this.x, this.y, this.symbol));
                }
            }

            draw() {
                if (this.isExploded) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.angle) * 0.3); // rocking motion
                
                // Pure white nodes with bright white glow
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                
                ctx.font = `bold ${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        // Setup the Scene
        const wavesCount = 4;
        let waveRows = [];
        let particles = [];

        function initWaves() {
            waveRows = [];
            particles = [];
            const spacingX = 40; // Horizontal gap between notes
            
            for (let w = 0; w < wavesCount; w++) {
                let nodes = [];
                // Distribute wave baselines evenly across the height of screen
                let baseRowY = (canvas.height / (wavesCount + 1)) * (w + 1);
                
                for (let x = 0; x < canvas.width + spacingX; x += spacingX) {
                    const randomSymbol = noteSymbols[Math.floor(Math.random() * noteSymbols.length)];
                    nodes.push(new WaveNode(x, baseRowY, randomSymbol, baseRowY));
                }
                waveRows.push(nodes);
            }
        }

        // Main Animation Loop
        function animate(timestamp) {
            // Clear canvas only, leaving the SVG background visible
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Process and draw wave notes
            for (let w = 0; w < waveRows.length; w++) {
                let nodes = waveRows[w];
                for (let i = 0; i < nodes.length; i++) {
                    nodes[i].update(timestamp, w);
                    nodes[i].draw();
                }
            }

            // Process and draw explosion particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                // Performance optimization: remove dead particles
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Periodically regenerate exploded nodes so screen doesn't go empty
            regenerateNodes();

            requestAnimationFrame(animate);
        }

        function regenerateNodes() {
            for (let w = 0; w < waveRows.length; w++) {
                let nodes = waveRows[w];
                for (let i = 0; i < nodes.length; i++) {
                    if (nodes[i].isExploded && Math.random() < 0.0015) { // slightly slower respawn
                        const randomSymbol = noteSymbols[Math.floor(Math.random() * noteSymbols.length)];
                        nodes[i] = new WaveNode(nodes[i].x, nodes[i].baseRowY, randomSymbol, nodes[i].baseRowY);
                    }
                }
            }
        }

        // Initialize and Run
        initWaves();
        requestAnimationFrame(animate);

        // Re-initialize on resize to fix spacing layout dynamically
        window.addEventListener('resize', initWaves);

    </script>
</body>
</html>
