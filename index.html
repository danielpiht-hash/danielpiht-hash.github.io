<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscillating Waves</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-gradient: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a192f; /* Deep dark blue */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="waveCanvas"></canvas>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Track mouse position
        const mouse = {
            x: null,
            y: null,
            radius: 80 // Distance to trigger "explosion"
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Particle class for the wave explosions
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Random explosion direction and velocity
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Configuration for 3 distinct flowing waves
        const waveConfigs = [
            { yBase: 0.3, amplitude: 40, frequency: 0.005, speed: 0.02, opacity: 0.3 },
            { yBase: 0.5, amplitude: 60, frequency: 0.008, speed: 0.015, opacity: 0.5 },
            { yBase: 0.7, amplitude: 50, frequency: 0.006, speed: 0.025, opacity: 0.2 }
        ];

        let time = 0;
        let particles = [];

        function animate() {
            // Slight trail effect for smoother visual flow
            ctx.fillStyle = 'rgba(10, 25, 47, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            time += 1;

            // Render and update waves
            waveConfigs.forEach(wave => {
                ctx.beginPath();
                let started = false;

                // Step across the screen horizontally
                for (let x = 0; x <= canvas.width; x += 4) {
                    // Standard sine wave calculation
                    const baseHeight = canvas.height * wave.yBase;
                    let y = baseHeight + Math.sin(x * wave.frequency + time * wave.speed) * wave.amplitude;

                    // Mouse Interaction (The Explosion trigger)
                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = x - mouse.x;
                        const dy = y - mouse.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < mouse.radius) {
                            // Spawn explosion particles at the point of impact
                            if (Math.random() < 0.3) { 
                                particles.push(new Particle(x, y));
                            }
                            // Push the wave rendering itself away slightly to look disrupted
                            const force = (mouse.radius - distance) / mouse.radius;
                            y += (dy / distance) * force * 50; 
                        }
                    }

                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                ctx.strokeStyle = `rgba(255, 255, 255, ${wave.opacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Update and draw explosion particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                
                // Remove faded particles
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
