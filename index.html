<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111;
    }

    /* ── Full-screen wallpaper ── */
    #bg {
      position: fixed;
      inset: 0;
      background: url('wallpaper.jpg') center/cover no-repeat;
      filter: brightness(0.55) blur(2px);
      z-index: 0;
    }

    /* ── Draggable player card ── */
    #player {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 340px;
      border-radius: 24px;
      background: rgba(15, 15, 20, 0.72);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 32px 80px rgba(0,0,0,0.55);
      padding: 28px 28px 24px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #player.dragging { cursor: grabbing; box-shadow: 0 48px 100px rgba(0,0,0,0.70); }

    /* Album art */
    #art-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #1a1a2e;
    }
    #art-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s;
    }
    #art-wrap img.fade-out { opacity: 0; }

    /* Vinyl spin ring */
    #vinyl-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.08);
      animation: spin 8s linear infinite;
      animation-play-state: paused;
      pointer-events: none;
    }
    #vinyl-ring.spinning { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Song info */
    #song-title {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #song-artist {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress bar */
    #progress-wrap {
      margin: 16px 0 6px;
      cursor: pointer;
    }
    #progress-bg {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      position: relative;
    }
    #progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #a78bfa, #6366f1);
      width: 0%;
    }
    #progress-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      left: 0%;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
    }

    /* ── SVG control layer ── */
    #controls-svg {
      width: 100%;
      margin-top: 8px;
      overflow: visible;
    }

    .btn-zone {
      cursor: pointer;
      fill: transparent;
      transition: fill 0.15s;
      rx: 10;
    }
    .btn-zone:hover { fill: rgba(255,255,255,0.08); }
    .btn-zone:active { fill: rgba(255,255,255,0.16); }

    .ctrl-icon { pointer-events: none; fill: rgba(255,255,255,0.85); }
    .ctrl-icon-sm { pointer-events: none; fill: rgba(255,255,255,0.55); }

    /* Volume */
    #vol-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }
    #vol-wrap svg { flex-shrink: 0; }
    #vol-slider {
      flex: 1;
      accent-color: #a78bfa;
      height: 4px;
      cursor: pointer;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30,30,40,0.92);
      border: 1px solid rgba(255,255,255,0.10);
      color: #fff;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 50px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 99;
      backdrop-filter: blur(10px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="bg"></div>

<div id="player">
  <div id="art-wrap">
    <img id="cover-img" src="" alt="Album Cover" />
    <div id="vinyl-ring"></div>
  </div>

  <div id="song-title">Loading…</div>
  <div id="song-artist">—</div>

  <div id="progress-wrap">
    <div id="progress-bg">
      <div id="progress-fill"></div>
      <div id="progress-thumb"></div>
    </div>
  </div>
  <div class="time-row">
    <span id="time-cur">0:00</span>
    <span id="time-dur">0:00</span>
  </div>

  <svg id="controls-svg" viewBox="0 0 284 60" xmlns="http://www.w3.org/2000/svg">
    <g id="btn-pause1">
      <rect class="btn-zone" x="2" y="8" width="52" height="44" rx="10"/>
      <rect class="ctrl-icon-sm" x="17" y="20" width="7" height="20" rx="2"/>
      <rect class="ctrl-icon-sm" x="30" y="20" width="7" height="20" rx="2"/>
    </g>

    <g id="btn-pause2">
      <rect class="btn-zone" x="60" y="8" width="52" height="44" rx="10"/>
      <rect class="ctrl-icon-sm" x="75" y="20" width="7" height="20" rx="2"/>
      <rect class="ctrl-icon-sm" x="88" y="20" width="7" height="20" rx="2"/>
    </g>

    <g id="btn-play">
      <rect class="btn-zone" x="116" y="2" width="52" height="56" rx="14"/>
      <polygon class="ctrl-icon" points="134,18 134,42 154,30" />
    </g>

    <g id="btn-skip">
      <rect class="btn-zone" x="174" y="8" width="108" height="44" rx="10"/>
      <polygon class="ctrl-icon-sm" points="208,20 208,40 188,30"/>
      <rect class="ctrl-icon-sm" x="183" y="20" width="5" height="20" rx="2"/>
      <text x="222" y="34" font-size="11" fill="rgba(255,255,255,0.45)" font-family="inherit" letter-spacing="1">RESET</text>
    </g>
  </svg>

  <div id="vol-wrap">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M2 5.5h2.5L8 2.5v11L4.5 10.5H2v-5z" fill="rgba(255,255,255,0.4)"/>
      <path d="M10.5 4.5a4 4 0 0 1 0 7" stroke="rgba(255,255,255,0.4)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    </svg>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8" />
  </div>
</div>

<div id="toast"></div>

<audio id="audio"></audio>

<script>
  // Added album.jpeg as the designated structural cover image asset
  const SONGS = [
    {
      title: "Maxon Music",
      artist: "Maxon",
      cover: "album.jpeg",   
      src:   "maxonmusic.mp3" 
    }
  ];

  /* ── State ── */
  let idx = 0;
  let playing = false;

  const audio = document.getElementById('audio');
  const coverImg = document.getElementById('cover-img');
  const songTitle = document.getElementById('song-title');
  const songArtist = document.getElementById('song-artist');
  const progressFill = document.getElementById('progress-fill');
  const progressThumb = document.getElementById('progress-thumb');
  const timeCur = document.getElementById('time-cur');
  const timeDur = document.getElementById('time-dur');
  const vinylRing = document.getElementById('vinyl-ring');
  const volSlider = document.getElementById('vol-slider');
  const toast = document.getElementById('toast');

  /* ── Helpers ── */
  function fmt(s) {
    s = Math.floor(s) || 0;
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // Visual status notification display logic
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  /* ── Load song ── */
  function loadSong(i, autoplay) {
    const s = SONGS[i];
    songTitle.textContent = s.title;
    songArtist.textContent = s.artist;
    audio.src = s.src;
    audio.volume = parseFloat(volSlider.value);

    // Dynamic graphic canvas fading transition loop
    coverImg.classList.add('fade-out');
    setTimeout(() => {
      coverImg.src = s.cover;
      coverImg.onload = () => coverImg.classList.remove('fade-out');
      coverImg.onerror = () => {
        coverImg.src = '';
        coverImg.classList.remove('fade-out');
      };
    }, 350);

    progressFill.style.width = '0%';
    progressThumb.style.left = '0%';
    timeCur.textContent = '0:00';
    timeDur.textContent = '0:00';

    if (autoplay) {
      audio.play().then(() => setPlaying(true)).catch(() => {});
    } else {
      setPlaying(false);
    }
  }

  function setPlaying(state) {
    playing = state;
    if (state) {
      vinylRing.classList.add('spinning');
      updatePlayIcon(true);
    } else {
      vinylRing.classList.remove('spinning');
      updatePlayIcon(false);
    }
  }

  function updatePlayIcon(isPlaying) {
    const g = document.getElementById('btn-play');
    const oldIcons = g.querySelectorAll('.ctrl-icon');
    oldIcons.forEach(el => el.remove());

    if (isPlaying) {
      ['132', '146'].forEach(xPos => {
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'ctrl-icon');
        r.setAttribute('x', xPos);
        r.setAttribute('y', '19'); 
        r.setAttribute('width', '8'); 
        r.setAttribute('height', '22'); 
        r.setAttribute('rx', '2');
        g.appendChild(r);
      });
    } else {
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('class', 'ctrl-icon');
      poly.setAttribute('points', '134,18 134,42 154,30');
      g.appendChild(poly);
    }
  }

  /* ── Control Event Bindings ── */
  document.getElementById('btn-play').addEventListener('click', () => {
    if (playing) {
      audio.pause();
      setPlaying(false);
      showToast('Paused');
    } else {
      audio.play().then(() => setPlaying(true)).catch(() => showToast('Tap again to play'));
      showToast('Playing');
    }
  });

  function pauseAction(label) {
    if (playing) {
      audio.pause();
      setPlaying(false);
      showToast(label + ' — Paused');
    }
  }
  document.getElementById('btn-pause1').addEventListener('click', () => pauseAction('⏸'));
  document.getElementById('btn-pause2').addEventListener('click', () => pauseAction('⏸'));

  document.getElementById('btn-skip').addEventListener('click', () => {
    audio.currentTime = 0; 
    showToast('Track Reset');
  });

  /* ── Progress scrub management ── */
  document.getElementById('progress-wrap').addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    audio.currentTime = ratio * audio.duration;
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    timeCur.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    timeDur.textContent = fmt(audio.duration);
  });

  audio.addEventListener('ended', () => {
    audio.currentTime = 0;
    setPlaying(false);
    showToast('Track Finished');
  });

  /* ── Volume ── */
  volSlider.addEventListener('input', () => {
    audio.volume = parseFloat(volSlider.value);
  });

  /* ── Drag implementation ── */
  const player = document.getElementById('player');
  let drag = false, ox = 0, oy = 0;

  player.addEventListener('mousedown', startDrag);
  player.addEventListener('touchstart', startDrag, { passive: true });

  function startDrag(e) {
    if (e.target.closest('.btn-zone, #progress-wrap, #vol-slider')) return;
    drag = true;
    player.classList.add('dragging');
    
    const r = player.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    ox = clientX - r.left;
    oy = clientY - r.top;
    
    player.style.transform = 'none';
    player.style.left = r.left + 'px';
    player.style.top = r.top + 'px';
  }

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove, { passive: false });

  function handleMove(e) {
    if (!drag) return;
    if (e.cancelable) e.preventDefault();
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const nx = clientX - ox;
    const ny = clientY - oy;
    
    player.style.left = Math.max(0, Math.min(window.innerWidth - player.offsetWidth, nx)) + 'px';
    player.style.top = Math.max(0, Math.min(window.innerHeight - player.offsetHeight, ny)) + 'px';
  }

  const endDrag = () => { drag = false; player.classList.remove('dragging'); };
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);

  /* ── Init ── */
  loadSong(0, false);
</script>
</body>
</html>
