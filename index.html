<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscillating Waves - Sakura & Creeper Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b111e;
        }
        /* Layer 1: Background Container (Sakura & Creeper Image) */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Using the generated image that merges the Sakura backdrop with the glass-break creeper */
            background-image: url('https://ai-art-generator.s3.us-east-1.amazonaws.com/image_4.png');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }
        /* Layer 2: Interactive Canvas Overlaid on top */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="background-container"></div>
    <canvas id="waveCanvas"></canvas>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        // Handle scaling for crisp rendering
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Mouse telemetry
        const mouse = {
            x: null,
            y: null,
            radius: 90 // Trigger distance for explosions
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Particle Class for Wave Explosions
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.size = Math.random() * 3 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.97; // Subtle air resistance
                this.vy *= 0.97;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Configuration sets for 3 layers of flowing waves
        const waveConfigs = [
            { yBase: 0.35, amplitude: 35, frequency: 0.006, speed: 0.02, opacity: 0.25, lineWidth: 1.5 },
            { yBase: 0.50, amplitude: 55, frequency: 0.004, speed: 0.015, opacity: 0.6, lineWidth: 3 },
            { yBase: 0.65, amplitude: 45, frequency: 0.008, speed: 0.025, opacity: 0.35, lineWidth: 2 }
        ];

        let time = 0;
        let particles = [];

        function animate() {
            // Clear the canvas cleanly each frame to keep the background image crisp underneath
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            time += 1;

            // Compute and draw oscillating waves
            waveConfigs.forEach(wave => {
                ctx.beginPath();
                let started = false;

                for (let x = 0; x <= canvas.width; x += 3) {
                    const baseHeight = canvas.height * wave.yBase;
                    let y = baseHeight + Math.sin(x * wave.frequency + time * wave.speed) * wave.amplitude;

                    // Mouse collision check
                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = x - mouse.x;
                        const dy = y - mouse.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < mouse.radius) {
                            // Generate explosion particles when tracking over the wave lines
                            if (Math.random() < 0.4) {
                                particles.push(new Particle(x, y));
                            }
                            // Deflect the wave line dynamically to match physical impact
                            const force = (mouse.radius - distance) / mouse.radius;
                            y += (dy / distance) * force * 45;
                        }
                    }

                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }

                ctx.strokeStyle = `rgba(255, 255, 255, ${wave.opacity})`;
                ctx.lineWidth = wave.lineWidth;
                ctx.lineCap = 'round';
                ctx.stroke();
            });

            // Update, parse, and render exploding particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Start animation loop
        animate();
    </script>
</body>
</html>
