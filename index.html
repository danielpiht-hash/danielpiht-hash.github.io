<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111;
    }

    /* ── Full-screen wallpaper ── */
    #bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.4) 0%, rgba(15, 23, 42, 0.4) 100%), 
                  url('wallpaper.jpg') no-repeat center center;
      background-size: cover;
      filter: brightness(0.65) blur(2px);
      z-index: 0;
    }

    /* ── White Wavy Music Notes Background ── */
    #music-notes-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .bg-note-wave {
      position: absolute;
      font-size: 58px;
      color: rgba(255, 255, 255, 0.55);
      filter: blur(2.5px);
      will-change: transform, opacity;
      mix-blend-mode: screen;
      user-select: none;
      text-shadow: 0 0 12px rgba(255,255,255,0.4);
    }

    /* ── Zero-Lag Money Styles ── */
    #money-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      perspective: 500px;
    }
    .bill {
      position: absolute;
      width: 110px;
      height: 46px;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .bill-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 2px;
    }
    .bill-front {
      transform: rotateY(0deg);
    }
    .bill-back {
      transform: rotateY(180deg);
    }
    .bill-shard {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ff5500;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* ── Draggable player card ── */
    #player {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 340px;
      border-radius: 24px;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 32px 80px rgba(0,0,0,0.55);
      padding: 28px 28px 24px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #player.dragging { cursor: grabbing; box-shadow: 0 48px 100px rgba(0,0,0,0.70); }

    /* Album art */
    #art-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #1a1a2e;
    }
    #art-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s;
    }
    #art-wrap img.fade-out { opacity: 0; }

    /* Vinyl spin ring animation */
    #vinyl-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.15);
      animation: spin 12s linear infinite;
      animation-play-state: paused;
      pointer-events: none;
    }
    #vinyl-ring.spinning { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Song info */
    #song-title {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #song-artist {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress bar */
    #progress-wrap {
      margin: 16px 0 6px;
      cursor: pointer;
      padding: 4px 0;
    }
    #progress-bg {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      position: relative;
    }
    #progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #a78bfa, #6366f1);
      width: 0%;
    }
    #progress-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      left: 0%;
      transition: transform 0.1s;
    }
    #progress-wrap:hover #progress-thumb {
      transform: translate(-50%, -50%) scale(1.2);
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    /* ── SVG controls ── */
    #controls-svg {
      width: 100%;
      margin-top: 8px;
      overflow: visible;
    }

    .btn-zone {
      cursor: pointer;
      fill: transparent;
      transition: fill 0.15s;
    }
    .btn-zone:hover { fill: rgba(255,255,255,0.08); }
    .btn-zone:active { fill: rgba(255,255,255,0.16); }

    .ctrl-icon { pointer-events: none; fill: rgba(255,255,255,0.9); }
    .ctrl-icon-sm { pointer-events: none; fill: rgba(255,255,255,0.6); }

    /* Volume */
    #vol-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding: 0 4px;
    }
    #vol-wrap svg { flex-shrink: 0; }
    #vol-slider {
      flex: 1;
      accent-color: #a78bfa;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    /* Toast notification */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 20, 25, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 13px;
      padding: 10px 22px;
      border-radius: 50px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 99;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Added TV for Music Video ── */
    #tv {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 460px;
      height: 290px;
      background: #0a0a0a;
      border: 18px solid #222;
      border-radius: 12px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      z-index: 5;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #tv.dragging { cursor: grabbing; }
    #tv::before {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 8px;
      background: #333;
      border-radius: 4px;
    }
    #music-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TV Title */
    #tv-title {
      position: fixed;
      bottom: 340px;
      right: 40px;
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-weight: 500;
      background: rgba(15,15,20,0.8);
      padding: 6px 14px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      z-index: 6;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="music-notes-container"></div>
  <div id="money-container"></div>

  <div id="player">
    <div id="art-wrap">
      <img id="cover-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%231e1b4b'/><circle cx='50' cy='50' r='20' fill='%234338ca'/></svg>" alt="Album Cover" />
      <div id="vinyl-ring"></div>
    </div>

    <div id="song-title">Loading…</div>
    <div id="song-artist">—</div>

    <div id="progress-wrap">
      <div id="progress-bg">
        <div id="progress-fill"></div>
        <div id="progress-thumb"></div>
      </div>
    </div>
    <div class="time-row">
      <span id="time-cur">0:00</span>
      <span id="time-dur">0:00</span>
    </div>

    <svg id="controls-svg" viewBox="0 0 284 60" xmlns="http://www.w3.org/2000/svg">
      <g id="btn-pause1">
        <rect class="btn-zone" x="14" y="8" width="52" height="44" rx="10"/>
        <rect class="ctrl-icon-sm" x="31" y="20" width="5" height="20" rx="1.5"/>
        <rect class="ctrl-icon-sm" x="42" y="20" width="5" height="20" rx="1.5"/>
      </g>

      <g id="btn-play">
        <rect class="btn-zone" x="116" y="2" width="52" height="56" rx="14"/>
        <polygon class="ctrl-icon" points="134,18 134,42 154,30" />
      </g>

      <g id="btn-skip">
        <rect class="btn-zone" x="218" y="8" width="52" height="44" rx="10"/>
        <polygon class="ctrl-icon-sm" points="248,20 248,40 232,30"/>
        <rect class="ctrl-icon-sm" x="226" y="20" width="4" height="20" rx="1"/>
      </g>
    </svg>

    <div id="vol-wrap">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 5.5h2.5L8 2.5v11L4.5 10.5H2v-5z" fill="rgba(255,255,255,0.6)"/>
        <path d="M11 5a3.5 3.5 0 0 1 0 6" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </div>

  <!-- Added TV Group -->
  <div id="tv-group">
    <!-- Added TV -->
    <div id="tv">
      <video id="music-video" loop muted>
        <source src="musicvideo.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Added TV Title -->
    <div id="tv-title">Hate The Morning (Official Music Video) - Maxon Margiela</div>
  </div>

  <div id="toast"></div>
  <audio id="audio" crossorigin="anonymous"></audio>

  <script>
    // Track Catalog Array
    const SONGS = [
      {
        title: "Hate The Morning",
        artist: "Maxon Margiela",
        cover: "album.jpeg",   
        src:   "maxonmusic.mp3" 
      }
    ];

    /* ── State variables ── */
    let idx = 0;
    let playing = false;

    // DOM Elements
    const audio = document.getElementById('audio');
    const coverImg = document.getElementById('cover-img');
    const songTitle = document.getElementById('song-title');
    const songArtist = document.getElementById('song-artist');
    const progressWrap = document.getElementById('progress-wrap');
    const progressBg = document.getElementById('progress-bg');
    const progressFill = document.getElementById('progress-fill');
    const progressThumb = document.getElementById('progress-thumb');
    const timeCur = document.getElementById('time-cur');
    const timeDur = document.getElementById('time-dur');
    const vinylRing = document.getElementById('vinyl-ring');
    const volSlider = document.getElementById('vol-slider');
    const toast = document.getElementById('toast');
    const player = document.getElementById('player');

    /* ── Added Video Element ── */
    const musicVideo = document.getElementById('music-video');

    /* ── Notification Management ── */
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    /* ── Time Formatting Utility ── */
    function fmt(s) {
      if (isNaN(s) || s === Infinity) return '0:00';
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return mins + ':' + String(secs).padStart(2, '0');
    }

    /* ── Music Metadata Management ── */
    function loadSong(i, autoplay) {
      const s = SONGS[i];
      if (!s) return;

      songTitle.textContent = s.title;
      songArtist.textContent = s.artist;
      audio.src = s.src;
      audio.volume = parseFloat(volSlider.value);

      coverImg.classList.add('fade-out');
      setTimeout(() => {
        coverImg.src = s.cover;
        coverImg.onload = () => coverImg.classList.remove('fade-out');
        coverImg.onerror = () => {
          coverImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%231e1b4b'/></svg>";
          coverImg.classList.remove('fade-out');
        };
      }, 200);

      progressFill.style.width = '0%';
      progressThumb.style.left = '0%';
      timeCur.textContent = '0:00';
      timeDur.textContent = '0:00';

      if (autoplay) {
        audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
      } else {
        setPlaying(false);
      }
    }

    function setPlaying(state) {
      playing = state;
      if (state) {
        vinylRing.classList.add('spinning');
        updatePlayIcon(true);
      } else {
        vinylRing.classList.remove('spinning');
        updatePlayIcon(false);
      }
    }

    function updatePlayIcon(isPlaying) {
      const g = document.getElementById('btn-play');
      const oldIcons = g.querySelectorAll('.ctrl-icon');
      oldIcons.forEach(el => el.remove());

      if (isPlaying) {
        [['132', '6'], ['146', '6']].forEach(([xPos, width]) => {
          const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          r.setAttribute('class', 'ctrl-icon');
          r.setAttribute('x', xPos);
          r.setAttribute('y', '19'); 
          r.setAttribute('width', width); 
          r.setAttribute('height', '22'); 
          r.setAttribute('rx', '1.5');
          g.appendChild(r);
        });
      } else {
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('class', 'ctrl-icon');
        poly.setAttribute('points', '134,18 134,42 154,30');
        g.appendChild(poly);
      }
    }

    /* ── Interactive Player Controls ── */
    document.getElementById('btn-play').addEventListener('click', () => {
      if (playing) {
        audio.pause();
        musicVideo.pause();
        setPlaying(false);
        showToast('Paused');
      } else {
        audio.play()
          .then(() => {
            musicVideo.play();
            setPlaying(true);
            showToast('Playing');
          })
          .catch(() => showToast('Audio file not found / blocked'));
      }
    });

    document.getElementById('btn-pause1').addEventListener('click', () => {
      if (playing) {
        audio.pause();
        musicVideo.pause();
        setPlaying(false);
        showToast('Paused');
      }
    });

    document.getElementById('btn-skip').addEventListener('click', () => {
      audio.currentTime = 0; 
      musicVideo.currentTime = 0;
      showToast('Track Restarted');
    });

    /* ── Progress Scrub Mechanics ── */
    progressWrap.addEventListener('click', e => {
      if (!audio.duration) return;
      const rect = progressBg.getBoundingClientRect();
      const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
      audio.currentTime = ratio * audio.duration;
      musicVideo.currentTime = audio.currentTime;
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      progressThumb.style.left = pct + '%';
      timeCur.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      timeDur.textContent = fmt(audio.duration);
    });

    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      musicVideo.currentTime = 0;
      setPlaying(false);
      showToast('Track Finished');
    });

    /* ── Volume Handling ── */
    volSlider.addEventListener('input', () => {
      audio.volume = parseFloat(volSlider.value);
    });

    /* ── Strict Container Boundary Card Drag Engine ── */
    let dragActive = false;
    let startX = 0, startY = 0;
    let initialX = 0, initialY = 0;

    player.addEventListener('mousedown', initDrag);
    player.addEventListener('touchstart', initDrag, { passive: true });

    function initDrag(e) {
      if (e.target.closest('.btn-zone, #progress-wrap, #vol-slider')) return;
      
      dragActive = true;
      player.classList.add('dragging');
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const rect = player.getBoundingClientRect();
      initialX = rect.left;
      initialY = rect.top;
      
      startX = clientX;
      startY = clientY;
      
      player.style.transform = 'none';
      player.style.left = initialX + 'px';
      player.style.top = initialY + 'px';
    }

    document.addEventListener('mousemove', performDrag);
    document.addEventListener('touchmove', performDrag, { passive: false });

    function performDrag(e) {
      if (!dragActive) return;
      if (e.cancelable) e.preventDefault();
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const deltaX = clientX - startX;
      const deltaY = clientY - startY;
      
      let targetX = initialX + deltaX;
      let targetY = initialY + deltaY;
      
      const boundX = window.innerWidth - player.offsetWidth;
      const boundY = window.innerHeight - player.offsetHeight;
      
      player.style.left = Math.min(Math.max(0, targetX), boundX) + 'px';
      player.style.top = Math.min(Math.max(0, targetY), boundY) + 'px';
    }

    const terminateDrag = () => { 
      if (dragActive) {
        dragActive = false; 
        player.classList.remove('dragging'); 
      }
    };
    
    document.addEventListener('mouseup', terminateDrag);
    document.addEventListener('touchend', terminateDrag);
    window.addEventListener('resize', () => {
      const rect = player.getBoundingClientRect();
      const boundX = window.innerWidth - player.offsetWidth;
      const boundY = window.innerHeight - player.offsetHeight;
      if (rect.left > boundX) player.style.left = Math.max(0, boundX) + 'px';
      if (rect.top > boundY) player.style.top = Math.max(0, boundY) + 'px';
    });

    /* ── TV Group Drag Engine ── */
    const tvGroup = document.getElementById('tv-group');
    let tvDragActive = false;
    let tvStartX = 0, tvStartY = 0;
    let tvInitialX = 0, tvInitialY = 0;

    tvGroup.style.position = 'fixed';
    tvGroup.style.zIndex = '5';

    tvGroup.addEventListener('mousedown', initTvDrag);
    tvGroup.addEventListener('touchstart', initTvDrag, { passive: true });

    function initTvDrag(e) {
      tvDragActive = true;
      document.getElementById('tv').classList.add('dragging');
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const rect = tvGroup.getBoundingClientRect();
      tvInitialX = rect.left;
      tvInitialY = rect.top;
      
      tvStartX = clientX;
      tvStartY = clientY;
      
      tvGroup.style.left = tvInitialX + 'px';
      tvGroup.style.top = tvInitialY + 'px';
      tvGroup.style.transform = 'none';
    }

    function performTvDrag(e) {
      if (!tvDragActive) return;
      if (e.cancelable) e.preventDefault();
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const deltaX = clientX - tvStartX;
      const deltaY = clientY - tvStartY;
      
      let targetX = tvInitialX + deltaX;
      let targetY = tvInitialY + deltaY;
      
      const boundX = window.innerWidth - document.getElementById('tv').offsetWidth;
      const boundY = window.innerHeight - (document.getElementById('tv').offsetHeight + 60);
      
      tvGroup.style.left = Math.min(Math.max(0, targetX), boundX) + 'px';
      tvGroup.style.top = Math.min(Math.max(0, targetY), boundY) + 'px';
    }

    function terminateTvDrag() {
      if (tvDragActive) {
        tvDragActive = false;
        document.getElementById('tv').classList.remove('dragging');
      }
    }

    document.addEventListener('mousemove', performTvDrag);
    document.addEventListener('touchmove', performTvDrag, { passive: false });
    document.addEventListener('mouseup', terminateTvDrag);
    document.addEventListener('touchend', terminateTvDrag);

    /* ── Flat, Pure Cartoon Money Engine ── */
    const moneyContainer = document.getElementById('money-container');
    
    const svg100Front = `
      <svg width="100%" height="100%" viewBox="0 0 110 46" xmlns="http://www.w3.org/2000/svg">
        <rect width="110" height="46" fill="#e3edd5" stroke="#9bb18d" stroke-width="1.5"/>
        <rect x="3" y="3" width="104" height="40" fill="none" stroke="#b4c7a8" stroke-width="0.75" stroke-dasharray="2,1"/>
        
        <line x1="12" y1="8" x2="98" y2="8" stroke="#cad4c0" stroke-width="0.5"/>
        <line x1="12" y1="38" x2="98" y2="38" stroke="#cad4c0" stroke-width="0.5"/>
        
        <rect x="72" y="0" width="7" height="46" fill="#5b8bb3" opacity="0.85"/>
        <line x1="75.5" y1="0" x2="75.5" y2="46" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="3,3"/>
        
        <ellipse cx="44" cy="23" rx="11" ry="14" fill="#d3e0c3" opacity="0.7"/>
        <path d="M38,32 C38,24 50,24 50,32 Z" fill="#9fae90" opacity="0.6"/>
        <circle cx="44" cy="19" r="5" fill="#9fae90" opacity="0.6"/>
        
        <text x="10" y="38" font-family="'Courier New', monospace" font-weight="900" font-size="15" fill="#4d6143" letter-spacing="-0.5">100</text>
        <text x="83" y="17" font-family="sans-serif" font-weight="bold" font-size="8" fill="#4d6143">100</text>
        
        <path d="M88,32 L96,32 L94,27 L90,27 Z" fill="#9c7a46" opacity="0.9"/>
        <circle cx="92" cy="27" r="2" fill="#e3edd5"/>

        <!-- Enhanced Realistic Burning Effect -->
        <path d="M-4,12 Q8,8 18,22 Q12,35 4,46 L-4,46 Z" fill="#ff3300" opacity="0.92"/>
        <path d="M-3,15 Q14,11 21,26 Q15,37 6,46 L-3,46 Z" fill="#ff8800" opacity="0.88"/>
        <path d="M-2,19 Q11,16 19,29 Q13,39 7,46 L-2,46 Z" fill="#ffbb00" opacity="0.85"/>
        <path d="M-1,24 Q9,22 16,32 Q11,41 8,46 L-1,46 Z" fill="#ffeeaa" opacity="0.75"/>
        
        <!-- Inner glowing core -->
        <path d="M2,26 Q7,24 11,29 Q8,34 5,39 Z" fill="#ffff88" opacity="0.65"/>
        
        <!-- Small embers -->
        <circle cx="6" cy="18" r="1.8" fill="#ffdd55" opacity="0.9"/>
        <circle cx="12" cy="14" r="1.2" fill="#ffaa33" opacity="0.85"/>
        <circle cx="4" cy="31" r="1.4" fill="#ff7733" opacity="0.8"/>
      </svg>
    `;

    const svg100Back = `
      <svg width="100%" height="100%" viewBox="0 0 110 46" xmlns="http://www.w3.org/2000/svg">
        <rect width="110" height="46" fill="#dbe6cb" stroke="#9bb18d" stroke-width="1.5"/>
        <rect x="3" y="3" width="104" height="40" fill="none" stroke="#a7bd99" stroke-width="0.5"/>
        
        <rect x="30" y="16" width="50" height="18" fill="#7d9471" opacity="0.6"/>
        <rect x="50" y="8" width="10" height="8" fill="#6a825e" opacity="0.7"/>
        <line x1="55" y1="4" x2="55" y2="8" stroke="#566d4b" stroke-width="1"/>
        
        <text x="8" y="18" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#5c7351">100</text>
        <text x="84" y="38" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#45573c">100</text>
        
        <!-- Enhanced Realistic Burning Effect -->
        <path d="M-4,12 Q8,8 18,22 Q12,35 4,46 L-4,46 Z" fill="#ff3300" opacity="0.92"/>
        <path d="M-3,15 Q14,11 21,26 Q15,37 6,46 L-3,46 Z" fill="#ff8800" opacity="0.88"/>
        <path d="M-2,19 Q11,16 19,29 Q13,39 7,46 L-2,46 Z" fill="#ffbb00" opacity="0.85"/>
        <path d="M-1,24 Q9,22 16,32 Q11,41 8,46 L-1,46 Z" fill="#ffeeaa" opacity="0.75"/>
        
        <!-- Inner glowing core -->
        <path d="M2,26 Q7,24 11,29 Q8,34 5,39 Z" fill="#ffff88" opacity="0.65"/>
        
        <!-- Small embers -->
        <circle cx="6" cy="18" r="1.8" fill="#ffdd55" opacity="0.9"/>
        <circle cx="12" cy="14" r="1.2" fill="#ffaa33" opacity="0.85"/>
        <circle cx="4" cy="31" r="1.4" fill="#ff7733" opacity="0.8"/>
      </svg>
    `;

    let activeBills = [];

    function spawnBill() {
      if (activeBills.length >= 6) return;

      const el = document.createElement('div');
      el.className = 'bill';
      
      el.innerHTML = `
        <div class="bill-face bill-front">${svg100Front}</div>
        <div class="bill-face bill-back">${svg100Back}</div>
      `;

      let xPos = Math.random() * (window.innerWidth - 110);
      let yPos = -50;
      
      let fallSpeed = 1.3; 
      let swaySpeed = 0.01;
      let swayAmount = 15;
      let rotationSpeedX = 0.8; 
      let rotationSpeedY = 1.5;
      
      let seed = Math.random() * 100;
      let rotX = Math.random() * 360;
      let rotY = Math.random() * 360;
      let rotZ = (Math.random() - 0.5) * 15;

      el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
      moneyContainer.appendChild(el);

      const billObj = {
        element: el,
        x: xPos,
        y: yPos,
        fallSpeed,
        swaySpeed,
        swayAmount,
        rotationSpeedX,
        rotationSpeedY,
        seed,
        rotX,
        rotY,
        rotZ
      };

      el.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        explodeBill(billObj);
      });
      el.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        explodeBill(billObj);
      }, { passive: true });

      activeBills.push(billObj);
    }

    function explodeBill(bill) {
      activeBills = activeBills.filter(b => b !== bill);
      const rect = bill.element.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      bill.element.remove();

      const shardCount = 18;
      for (let i = 0; i < shardCount; i++) {
        const shard = document.createElement('div');
        shard.className = 'bill-shard';
        shard.style.transform = `translate3d(${centerX}px, ${centerY}px, 0)`;
        moneyContainer.appendChild(shard);

        const angle = Math.random() * Math.PI * 2;
        const velocity = 5.5;
        let sX = Math.cos(angle) * velocity;
        let sY = Math.sin(angle) * velocity - 2.5;
        let opacity = 1;
        let curX = centerX;
        let curY = centerY;

        function updateShard() {
          sY += 0.35; 
          curX += sX;
          curY += sY;
          opacity -= 0.055;

          shard.style.transform = `translate3d(${curX}px, ${curY}px, 0)`;
          shard.style.opacity = opacity;

          if (opacity <= 0) {
            shard.remove();
          } else {
            requestAnimationFrame(updateShard);
          }
        }
        requestAnimationFrame(updateShard);
      }
    }

    function updateMoneyEngine() {
      for (let i = activeBills.length - 1; i >= 0; i--) {
        const b = activeBills[i];
        b.y += b.fallSpeed;
        b.seed += b.swaySpeed;
        
        const currentX = b.x + Math.sin(b.seed) * b.swayAmount;
        b.rotX += b.rotationSpeedX;
        b.rotY += b.rotationSpeedY;

        b.element.style.transform = `translate3d(${currentX}px, ${b.y}px, 0) rotateX(${b.rotX}deg) rotateY(${b.rotY}deg) rotateZ(${b.rotZ}deg)`;

        if (b.y > window.innerHeight + 50) {
          b.element.remove();
          activeBills.splice(i, 1);
        }
      }
      requestAnimationFrame(updateMoneyEngine);
    }

    /* ── White Wavy Music Notes Engine ── */
    const notesContainer = document.getElementById('music-notes-container');
    const NOTE_CHARS = ['♪', '♫', '♩', '♬', '♭', '♮', '♯'];
    let activeNotes = [];

    function spawnNoteWave() {
      if (activeNotes.length >= 12) return;

      const el = document.createElement('div');
      el.className = 'bg-note-wave';
      el.textContent = NOTE_CHARS[Math.floor(Math.random() * NOTE_CHARS.length)];

      let xPos = Math.random() * window.innerWidth;
      let yPos = window.innerHeight + 50;
      let currentOpacity = 0;
      let maxOpacity = 0.6 + Math.random() * 0.15;
      
      let floatSpeed = 0.55 + Math.random() * 0.75;
      let waveSeed = Math.random() * 100;
      let waveSpeed = 0.006 + Math.random() * 0.012;
      let waveAmount = 28 + Math.random() * 35;
      let currentScale = 0.75 + Math.random() * 0.65;

      el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0) scale(${currentScale})`;
      el.style.opacity = currentOpacity;
      notesContainer.appendChild(el);

      activeNotes.push({
        element: el,
        x: xPos,
        y: yPos,
        floatSpeed,
        waveSeed,
        waveSpeed,
        waveAmount,
        currentOpacity,
        maxOpacity,
        currentScale,
        fadingIn: true
      });
    }

    function updateNotesEngine() {
      for (let i = activeNotes.length - 1; i >= 0; i--) {
        const n = activeNotes[i];
        n.y -= n.floatSpeed;
        n.waveSeed += n.waveSpeed;

        const currentX = n.x + Math.sin(n.waveSeed) * n.waveAmount;

        if (n.fadingIn) {
          n.currentOpacity += 0.018;
          if (n.currentOpacity >= n.maxOpacity) {
            n.currentOpacity = n.maxOpacity;
            n.fadingIn = false;
          }
        } else if (n.y < window.innerHeight * 0.4) {
          n.currentOpacity -= 0.009;
        }

        n.element.style.transform = `translate3d(${currentX}px, ${n.y}px, 0) scale(${n.currentScale})`;
        n.element.style.opacity = n.currentOpacity;

        if (n.y < -70 || n.currentOpacity <= 0) {
          n.element.remove();
          activeNotes.splice(i, 1);
        }
      }
      requestAnimationFrame(updateNotesEngine);
    }

    // Orchestrate cycles
    setInterval(spawnBill, 2000); 
    setInterval(spawnNoteWave, 1400);
    
    requestAnimationFrame(updateMoneyEngine);
    requestAnimationFrame(updateNotesEngine);

    /* ── Initialization ── */
    loadSong(idx, false);
  </script>
</body>
</html>
