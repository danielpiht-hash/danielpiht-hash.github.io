<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Music Widget</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            /* Full-screen background setup */
            background: url('wallpaper.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Container for the app widget layout */
        #widget-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* SVG Widget wrapper */
        .svg-layout-container {
            width: 100%;
            height: auto;
        }

        /* Interactive class properties applied to SVG paths */
        .interactive-btn {
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        .interactive-btn:hover {
            opacity: 0.8;
            filter: brightness(1.2);
        }
        .interactive-btn:active {
            transform: scale(0.95);
        }

        /* Draggable Cover Art Component utilizing local album.jpeg */
        #draggable-cover {
            width: 200px;
            height: 200px;
            background-color: #222;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: grab;
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 10;
            touch-action: none; /* Disables mobile scroll/pinch gestures during drag interaction */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        #draggable-cover:active {
            cursor: grabbing;
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        #draggable-cover .cover-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Blocks native image file dragging to prevent breaking script logic */
        }

        /* Toast UI Layer feedback styling */
        #status-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="draggable-cover">
        <img class="cover-art" src="album.jpeg" alt="Album Cover">
    </div>

    <div id="widget-container">
        <div class="svg-layout-container" id="svg-wrapper">
            </div>
    </div>

    <div id="status-toast">Status Update</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. INITIALIZE REAL AUDIO ENGINE OBJECT ---
            const audio = new Audio('maxonmusic.mp3');
            audio.loop = false;

            // --- 2. FETCH AND INJECT SVG CODE ---
            const svgWrapper = document.getElementById('svg-wrapper');
            
            fetch('layout.svg')
                .then(response => {
                    if (!response.ok) throw new Error('layout.svg asset not found');
                    return response.text();
                })
                .then(svgText => {
                    svgWrapper.innerHTML = svgText;
                    setupWidgetControls();
                })
                .catch(err => {
                    console.error('Error loading SVG layout:', err);
                    // Functional fallback engine if layout.svg asset is missing or blocked
                    svgWrapper.innerHTML = `
                        <div style="color: white; text-align: center; padding: 20px;">
                            <p style="margin: 0 0 15px 0; font-size:14px;">[layout.svg Not Found]</p>
                            <button id="fallback-play" style="padding: 10px 20px; margin: 5px; cursor:pointer;">Play</button>
                            <button id="fallback-pause" style="padding: 10px 20px; margin: 5px; cursor:pointer;">Pause</button>
                            <button id="fallback-skip" style="padding: 10px 20px; margin: 5px; cursor:pointer;">Restart Track</button>
                        </div>
                    `;
                    setupFallbackControls();
                });

            function setupWidgetControls() {
                const svgElement = svgWrapper.querySelector('svg');
                if (!svgElement) return;

                // Adjust inline dynamic height parameters to let container CSS handle scaling
                svgElement.setAttribute('width', '100%');
                svgElement.setAttribute('height', '100%');

                /* Map targets inside layout.svg paths */
                const btnPlay = svgElement.querySelector('#play') || svgElement.querySelector('[id*="play"]');
                const btnPause1 = svgElement.querySelector('#pause1') || svgElement.querySelector('[id*="pause"]');
                const btnPause2 = svgElement.querySelector('#pause2');
                const btnSkip = svgElement.querySelector('#skip') || svgElement.querySelector('[id*="skip"]');

                // Apply dynamic class bindings for pointer states
                const controlGroup = [btnPlay, btnPause1, btnPause2, btnSkip].filter(Boolean);
                controlGroup.forEach(btn => btn.classList.add('interactive-btn'));

                // Control action assignments 
                if (btnPlay) btnPlay.addEventListener('click', () => handleAudioControl('PLAY'));
                if (btnPause1) btnPause1.addEventListener('click', () => handleAudioControl('PAUSE'));
                if (btnPause2) btnPause2.addEventListener('click', () => handleAudioControl('PAUSE'));
                if (btnSkip) btnSkip.addEventListener('click', () => handleAudioControl('RESTART'));
            }

            function setupFallbackControls() {
                document.getElementById('fallback-play')?.addEventListener('click', () => handleAudioControl('PLAY'));
                document.getElementById('fallback-pause')?.addEventListener('click', () => handleAudioControl('PAUSE'));
                document.getElementById('fallback-skip')?.addEventListener('click', () => handleAudioControl('RESTART'));
            }

            // Core Audio Controller Logic
            function handleAudioControl(action) {
                switch(action) {
                    case 'PLAY':
                        audio.play()
                            .then(() => showToast("🔊 playing maxonmusic.mp3"))
                            .catch(err => {
                                console.log("Playback interaction error:", err);
                                showToast("Click anywhere on the background first to enable audio!");
                            });
                        break;
                        
                    case 'PAUSE':
                        audio.pause();
                        showToast("⏸️ Music Paused");
                        break;
                        
                    case 'RESTART':
                        audio.currentTime = 0; // Rewinds track timeline to beginning
                        audio.play()
                            .then(() => showToast("⏭️ Track Restarted"))
                            .catch(() => showToast("⏭️ Track Reset to 0:00"));
                        break;
                }
            }

            // --- 3. DRAGGABLE POSITION INTERACTION LOGIC (MOUSE & TOUCH) ---
            const draggableCover = document.getElementById('draggable-cover');
            let isDragging = false;
            let offsetX = 0;
            let offsetY = 0;

            function startDrag(e) {
                isDragging = true;
                
                // Normalizes viewport calculations between touch interfaces and mouse actions
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                const rect = draggableCover.getBoundingClientRect();
                
                offsetX = clientX - rect.left;
                offsetY = clientY - rect.top;
                
                document.addEventListener('mousemove', dragMove);
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchmove', dragMove, { passive: false });
                document.addEventListener('touchend', endDrag);
            }

            function dragMove(e) {
                if (!isDragging) return;
                if (e.cancelable) e.preventDefault(); // Prevents modern touch tracking browser drag behaviors

                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                let targetX = clientX - offsetX;
                let targetY = clientY - offsetY;

                // Screen safe-zone edge constraints boundary check
                const minX = 0;
                const minY = 0;
                const maxX = window.innerWidth - draggableCover.offsetWidth;
                const maxY = window.innerHeight - draggableCover.offsetHeight;

                if (targetX < minX) targetX = minX;
                if (targetX > maxX) targetX = maxX;
                if (targetY < minY) targetY = minY;
                if (targetY > maxY) targetY = maxY;

                draggableCover.style.left = `${targetX}px`;
                draggableCover.style.top = `${targetY}px`;
            }

            function endDrag() {
                isDragging = false;
                document.removeEventListener('mousemove', dragMove);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchmove', dragMove);
                document.removeEventListener('touchend', endDrag);
            }

            // Assign structural listeners
            draggableCover.addEventListener('mousedown', startDrag);
            draggableCover.addEventListener('touchstart', startDrag, { passive: true });

            // --- 4. TOAST NOTIFICATION ALERTS SYSTEM ---
            const toastElement = document.getElementById('status-toast');
            let toastTimeout;

            function showToast(message) {
                clearTimeout(toastTimeout);
                toastElement.textContent = message;
                toastElement.style.opacity = '1';
                toastTimeout = setTimeout(() => {
                    toastElement.style.opacity = '0';
                }, 2000);
            }
        });
    </script>
</body>
</html>
