<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player - Money Rain Edition</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0f19;
    }

    /* ── Money Rain Canvas Layer ── */
    #money-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: pointer;
    }

    /* ── Subtle Background gradient behind canvas ── */
    #bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      z-index: 0;
    }

    /* ── Draggable player card (Z-indexed above money) ── */
    #player {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 340px;
      border-radius: 24px;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(25px) saturate(1.8);
      -webkit-backdrop-filter: blur(25px) saturate(1.8);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 32px 80px rgba(0,0,0,0.65);
      padding: 28px 28px 24px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #player.dragging { cursor: grabbing; box-shadow: 0 48px 100px rgba(0,0,0,0.80); }

    /* Album art */
    #art-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #111322;
    }
    #art-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s;
    }
    #art-wrap img.fade-out { opacity: 0; }

    /* Vinyl spin ring animation */
    #vinyl-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px dashed rgba(167, 139, 250, 0.25);
      animation: spin 12s linear infinite;
      animation-play-state: paused;
      pointer-events: none;
    }
    #vinyl-ring.spinning { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Song info */
    #song-title {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #song-artist {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress bar */
    #progress-wrap {
      margin: 16px 0 6px;
      cursor: pointer;
      padding: 4px 0;
    }
    #progress-bg {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      position: relative;
    }
    #progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #34d399, #059669); /* Color matched to money vibe */
      width: 0%;
    }
    #progress-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      left: 0%;
      transition: transform 0.1s;
    }
    #progress-wrap:hover #progress-thumb {
      transform: translate(-50%, -50%) scale(1.2);
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    /* ── SVG controls ── */
    #controls-svg {
      width: 100%;
      margin-top: 8px;
      overflow: visible;
    }

    .btn-zone {
      cursor: pointer;
      fill: transparent;
      transition: fill 0.15s;
    }
    .btn-zone:hover { fill: rgba(255,255,255,0.08); }
    .btn-zone:active { fill: rgba(255,255,255,0.16); }

    .ctrl-icon { pointer-events: none; fill: rgba(255,255,255,0.9); }
    .ctrl-icon-sm { pointer-events: none; fill: rgba(255,255,255,0.6); }

    /* Volume */
    #vol-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding: 0 4px;
    }
    #vol-wrap svg { flex-shrink: 0; }
    #vol-slider {
      flex: 1;
      accent-color: #34d399;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    /* Toast notification */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 20, 25, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 13px;
      padding: 10px 22px;
      border-radius: 50px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 99;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="bg"></div>

<canvas id="money-canvas"></canvas>

<div id="player">
  <div id="art-wrap">
    <img id="cover-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23064e3b'/><circle cx='50' cy='50' r='20' fill='%23059669'/></svg>" alt="Album Cover" />
    <div id="vinyl-ring"></div>
  </div>

  <div id="song-title">Loading…</div>
  <div id="song-artist">—</div>

  <div id="progress-wrap">
    <div id="progress-bg">
      <div id="progress-fill"></div>
      <div id="progress-thumb"></div>
    </div>
  </div>
  <div class="time-row">
    <span id="time-cur">0:00</span>
    <span id="time-dur">0:00</span>
  </div>

  <svg id="controls-svg" viewBox="0 0 284 60" xmlns="http://www.w3.org/2000/svg">
    <g id="btn-pause1">
      <rect class="btn-zone" x="14" y="8" width="52" height="44" rx="10"/>
      <rect class="ctrl-icon-sm" x="31" y="20" width="5" height="20" rx="1.5"/>
      <rect class="ctrl-icon-sm" x="42" y="20" width="5" height="20" rx="1.5"/>
    </g>

    <g id="btn-play">
      <rect class="btn-zone" x="116" y="2" width="52" height="56" rx="14"/>
      <polygon class="ctrl-icon" points="134,18 134,42 154,30" />
    </g>

    <g id="btn-skip">
      <rect class="btn-zone" x="218" y="8" width="52" height="44" rx="10"/>
      <polygon class="ctrl-icon-sm" points="248,20 248,40 232,30"/>
      <rect class="ctrl-icon-sm" x="226" y="20" width="4" height="20" rx="1"/>
    </g>
  </svg>

  <div id="vol-wrap">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M2 5.5h2.5L8 2.5v11L4.5 10.5H2v-5z" fill="rgba(255,255,255,0.6)"/>
      <path d="M11 5a3.5 3.5 0 0 1 0 6" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8" />
  </div>
</div>

<div id="toast"></div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
  /* ── REALISTIC MONEY RAIN ENGINE (HTML5 Canvas) ── */
  const canvas = document.getElementById('money-canvas');
  const ctx = canvas.getContext('2d');

  let bills = [];
  let particles = [];
  const MAX_BILLS = 45;

  // Resize canvas dynamically
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Create highly optimized programmatic 100 Dollar Bill Texture
  const billCanvas = document.createElement('canvas');
  const bCtx = billCanvas.getContext('2d');
  billCanvas.width = 150;
  billCanvas.height = 65;

  function drawBillTexture() {
    // Base crisp money green
    bCtx.fillStyle = '#85bb65';
    bCtx.fillRect(0, 0, 150, 65);
    
    // Outer border thin line
    bCtx.strokeStyle = '#2e5618';
    bCtx.lineWidth = 3;
    bCtx.strokeRect(4, 4, 142, 57);
    
    // Fine detailed inside border
    bCtx.strokeStyle = '#4f8236';
    bCtx.lineWidth = 1;
    bCtx.strokeRect(8, 8, 134, 49);

    // Vignette background patterns
    bCtx.fillStyle = '#9ccc7c';
    bCtx.beginPath();
    bCtx.arc(75, 32.5, 22, 0, Math.PI * 2);
    bCtx.fill();

    // Portrait Placeholder (Benjamin Franklin silhouette representation)
    bCtx.fillStyle = '#5d8aa8';
    bCtx.beginPath();
    bCtx.ellipse(73, 34, 11, 15, 0, 0, Math.PI * 2);
    bCtx.fill();
    bCtx.fillStyle = '#3b6245';
    bCtx.beginPath();
    bCtx.ellipse(73, 31, 9, 11, 0, 0, Math.PI * 2);
    bCtx.fill();

    // Bold "100" details in corners
    bCtx.fillStyle = '#1e3f11';
    bCtx.font = 'bold 11px Georgia, serif';
    bCtx.fillText('100', 14, 21);
    bCtx.fillText('100', 122, 21);
    bCtx.fillText('100', 14, 54);
    bCtx.fillText('100', 122, 54);

    // Treasury Seals & Textures
    bCtx.fillStyle = '#0a3611';
    bCtx.font = 'bold 8px Arial';
    bCtx.fillText('ONE HUNDRED', 44, 59);
    
    bCtx.fillStyle = '#1b4d22';
    bCtx.beginPath();
    bCtx.arc(32, 35, 6, 0, Math.PI*2);
    bCtx.fill();
  }
  drawBillTexture();

  // Bill Class Constructor with Physics
  class Bill {
    constructor(isInitial = false) {
      this.width = 75 + Math.random() * 25; 
      this.height = this.width * (65 / 150);
      this.x = Math.random() * canvas.width;
      this.y = isInitial ? Math.random() * canvas.height : -this.height - 20;
      
      this.speedY = 1.5 + Math.random() * 2.5;
      this.speedX = Math.sin(Math.random() * Math.PI) * 0.8;
      
      // Multi-axis rotation configurations for full 3D tumbling appearance
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.03;
      this.scaleY = 1;
      this.scaleSpeed = 0.02 + Math.random() * 0.03;
      this.waveTime = Math.random() * 100;
    }

    update() {
      this.y += this.speedY;
      this.waveTime += 0.04;
      this.x += this.speedX + Math.sin(this.waveTime) * 0.5;
      
      this.rotation += this.rotationSpeed;
      // Triggers the 3D flipping cycle
      this.scaleY = Math.sin(this.waveTime);

      // Reset bill when it touches the floor
      if (this.y > canvas.height + this.height) {
        this.reset();
      }
    }

    reset() {
      this.x = Math.random() * canvas.width;
      this.y = -this.height - 20;
      this.speedY = 1.5 + Math.random() * 2.5;
      this.waveTime = Math.random() * 100;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.scale(1, Math.abs(this.scaleY)); // Simulates 3D flip over X-axis
      
      // Dynamic dark lighting/shading based on flip angle relative to pseudo light source
      let shadowIntensity = Math.abs(this.scaleY);
      ctx.globalAlpha = 0.2 + shadowIntensity * 0.8;

      // Draw standard texture onto master canvas scene
      ctx.drawImage(billCanvas, -this.width / 2, -this.height / 2, this.width, this.height);
      
      // Shadow overlay overlay 
      if (this.scaleY < 0) {
        ctx.fillStyle = 'rgba(20, 50, 20, 0.25)';
        ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
      }
      ctx.restore();
    }

    checkHit(mx, my) {
      // Basic distance checking vector around center pivot point
      const dx = this.x - mx;
      const dy = this.y - my;
      const radius = this.width / 1.3;
      if (Math.sqrt(dx * dx + dy * dy) < radius) {
        return true;
      }
      return false;
    }
  }

  // Spark Explosions Class
  class Particle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.radius = 2 + Math.random() * 4;
      this.alpha = 1;
      this.decay = 0.02 + Math.random() * 0.02;
      this.color = Math.random() > 0.5 ? '#a7f3d0' : '#fbbf24'; // Alternates between cash green and gold leaf sparks
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.1; // mild gravity pulling sparks down
      this.alpha -= this.decay;
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Populate Bill Array initially
  for (let i = 0; i < MAX_BILLS; i++) {
    bills.push(new Bill(true));
  }

  // Explosion Click Capture
  canvas.addEventListener('mousedown', (e) => {
    handleExplode(e.clientX, e.clientY);
  });

  canvas.addEventListener('touchstart', (e) => {
    if(e.touches.length > 0) {
      handleExplode(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  function handleExplode(clickX, clickY) {
    for (let i = bills.length - 1; i >= 0; i--) {
      if (bills[i].checkHit(clickX, clickY)) {
        // Trigger 25 burst particles at collision location
        for (let p = 0; p < 25; p++) {
          particles.push(new Particle(bills[i].x, bills[i].y));
        }
        // Respawn the hit bill instantly at top frame border
        bills[i].reset();
        break; // Single break kills one stacked bill target per click event loop
      }
    }
  }

  // Continuous Master Animation Loop
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Process falling cash assets
    bills.forEach(bill => {
      bill.update();
      bill.draw();
    });

    // Process particle dynamics structures
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      if (particles[i].alpha <= 0) {
        particles.splice(i, 1);
      } else {
        particles[i].draw();
      }
    }

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);


  /* ── AUDIO PLAYER FUNCTIONAL ENGINE ── */
  const SONGS = [
    {
      title: "Hate The Morning",
      artist: "Maxon Margiela",
      cover: "album.jpeg",   
      src:   "maxonmusic.mp3" 
    }
  ];

  let idx = 0;
  let playing = false;

  function fmt(s) {
    if (isNaN(s) || s === Infinity) return '0:00';
    const mins = Math.floor(s / 60);
    const secs = Math.floor(s % 60);
    return mins + ':' + String(secs).padStart(2, '0');
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function loadSong(i, autoplay) {
    const s = SONGS[i];
    if (!s) return;

    songTitle.textContent = s.title;
    songArtist.textContent = s.artist;
    audio.src = s.src;
    audio.volume = parseFloat(volSlider.value);

    coverImg.classList.add('fade-out');
    setTimeout(() => {
      coverImg.src = s.cover;
      coverImg.onload = () => coverImg.classList.remove('fade-out');
      coverImg.onerror = () => {
        coverImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23064e3b'/></svg>";
        coverImg.classList.remove('fade-out');
      };
    }, 200);

    progressFill.style.width = '0%';
    progressThumb.style.left = '0%';
    timeCur.textContent = '0:00';
    timeDur.textContent = '0:00';

    if (autoplay) {
      audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
    } else {
      setPlaying(false);
    }
  }

  function setPlaying(state) {
    playing = state;
    if (state) {
      vinylRing.classList.add('spinning');
      updatePlayIcon(true);
    } else {
      vinylRing.classList.remove('spinning');
      updatePlayIcon(false);
    }
  }

  function updatePlayIcon(isPlaying) {
    const g = document.getElementById('btn-play');
    const oldIcons = g.querySelectorAll('.ctrl-icon');
    oldIcons.forEach(el => el.remove());

    if (isPlaying) {
      [['132', '6'], ['146', '6']].forEach(([xPos, width]) => {
        const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('class', 'ctrl-icon');
        r.setAttribute('x', xPos);
        r.setAttribute('y', '19'); 
        r.setAttribute('width', width); 
        r.setAttribute('height', '22'); 
        r.setAttribute('rx', '1.5');
        g.appendChild(r);
      });
    } else {
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('class', 'ctrl-icon');
      poly.setAttribute('points', '134,18 134,42 154,30');
      g.appendChild(poly);
    }
  }

  /* Control Mappings */
  document.getElementById('btn-play').addEventListener('click', () => {
    if (playing) {
      audio.pause();
      setPlaying(false);
      showToast('Paused');
    } else {
      audio.play()
        .then(() => {
          setPlaying(true);
          showToast('Playing');
        })
        .catch(() => showToast('Audio file not found / blocked'));
    }
  });

  document.getElementById('btn-pause1').addEventListener('click', () => {
    if (playing) {
      audio.pause();
      setPlaying(false);
      showToast('Paused');
    }
  });

  document.getElementById('btn-skip').addEventListener('click', () => {
    audio.currentTime = 0; 
    showToast('Track Restarted');
  });

  progressWrap.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progressBg.getBoundingClientRect();
    const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    audio.currentTime = ratio * audio.duration;
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    timeCur.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    timeDur.textContent = fmt(audio.duration);
  });

  audio.addEventListener('ended', () => {
    audio.currentTime = 0;
    setPlaying(false);
    showToast('Track Finished');
  });

  volSlider.addEventListener('input', () => {
    audio.volume = parseFloat(volSlider.value);
  });

  /* ── Precise Card Drag Handling Engine ── */
  let dragActive = false;
  let startX = 0, startY = 0;
  let initialX = 0, initialY = 0;

  player.addEventListener('mousedown', initDrag);
  player.addEventListener('touchstart', initDrag, { passive: true });

  function initDrag(e) {
    if (e.target.closest('.btn-zone, #progress-wrap, #vol-slider')) return;
    
    dragActive = true;
    player.classList.add('dragging');
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const rect = player.getBoundingClientRect();
    initialX = rect.left;
    initialY = rect.top;
    
    startX = clientX;
    startY = clientY;
    
    player.style.transform = 'none';
    player.style.left = initialX + 'px';
    player.style.top = initialY + 'px';
  }

  document.addEventListener('mousemove', performDrag);
  document.addEventListener('touchmove', performDrag, { passive: false });

  function performDrag(e) {
    if (!dragActive) return;
    if (e.cancelable) e.preventDefault();
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const deltaX = clientX - startX;
    const deltaY = clientY - startY;
    
    let targetX = initialX + deltaX;
    let targetY = initialY + deltaY;
    
    const boundX = window.innerWidth - player.offsetWidth;
    const boundY = window.innerHeight - player.offsetHeight;
    
    player.style.left = Math.min(Math.max(0, targetX), boundX) + 'px';
    player.style.top = Math.min(Math.max(0, targetY), boundY) + 'px';
  }

  const terminateDrag = () => { 
    if (dragActive) {
      dragActive = false; 
      player.classList.remove('dragging'); 
    }
  };
  
  document.addEventListener('mouseup', terminateDrag);
  document.addEventListener('touchend', terminateDrag);

  // Initialize
  loadSong(idx, false);
</script>
</body>
</html>
