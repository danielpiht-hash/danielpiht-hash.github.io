<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Music Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            /* Full-screen background wallpaper */
            background: url('wallpaper.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Draggable Widget Container */
        #music-widget {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 280px;
            height: 600px;
            background-color: #000000; /* Fixed to complete black */
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            cursor: grab;
            user-select: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #music-widget:active {
            cursor: grabbing;
        }

        /* Song Cover Area (Top portion of the widget) */
        #cover-art-target {
            width: 100%;
            height: 480px; 
            background-color: #C2B69D; /* Matches the beige SVG inner background */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #cover-art-target img {
            width: 85%;
            height: 50%;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Controls Area (Bottom portion embedding the SVG) */
        .controls-container {
            width: 100%;
            height: 120px;
            position: relative;
            background-color: #000000; /* Fixed to complete black */
        }

        .controls-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* VISIBLE Interactive Button Overlays */
        .btn-overlay {
            position: absolute;
            bottom: 15px;
            height: 55px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.25); /* Semi-transparent white background */
            border: 2px solid #ffffff; /* Crisp white border to make buttons highly visible */
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        /* Interactive states for visual feedback */
        .btn-overlay:hover {
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
            transform: scale(1.03);
        }
        .btn-overlay:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.97);
        }

        /* Precise positioning over the SVG paths */
        #play-btn {
            left: 15px;
            width: 70px;
            border-radius: 40%;
        }

        #pause-btn {
            left: 110px;
            width: 50px;
            border-radius: 10px;
        }

        #skip-btn {
            right: 20px;
            width: 60px;
            border-radius: 40%;
        }

        /* Track Info Text Overlay */
        #track-info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #000000; /* Fixed text color to match black styling accents */
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div id="music-widget">
        <div id="cover-art-target">
            <img id="cover-image" src="" alt="Album Cover">
            <div id="track-info">Loading...</div>
        </div>

        <div class="controls-container">
            <svg viewBox="0 0 216 462" preserveAspectRatio="xMidYMax meet">
                <g id="Layer_1">
                    <rect x="4.5" y="4.5" fill="#C2B69D" stroke="#000000" stroke-width="9" width="207" height="453"/>
                    <rect x="0" y="375" fill="#000000" width="216" height="87"/>
                    
                    <path fill="#C2B69D" d="M12.7,419.9c2-12.8,12-22.1,24.8-22.1s27.5,13.8,27.5,26.6c0,8.7-7.2,14.7-15.9,14.7H28.1 C17.3,439.1,11.3,429.3,12.7,419.9z"/>
                    <rect x="91.4" y="394.9" fill="#C2B69D" width="9" height="39"/>
                    <rect x="114.7" y="394.9" fill="#C2B69D" width="9" height="39"/>
                    <path fill="#C2B69D" d="M191.6,413.7c0,11.2-8.5,19.9-19.7,19.9c-10.7,0-18.4-12-18.4-12s12.5-12,21.5-12 C185.3,393.7,191.6,402.4,191.6,413.7z"/>
                </g>
            </svg>

            <button class="btn-overlay" id="play-btn" title="Play"></button>
            <button class="btn-overlay" id="pause-btn" title="Pause"></button>
            <button class="btn-overlay" id="skip-btn" title="Restart Song"></button>
        </div>
    </div>

    <audio id="audio-player" src="maxonmusic.mp3"></audio>

    <script>
        // --- Track Information Configuration ---
        const trackData = {
            title: "Maxon Music",
            audio: "maxonmusic.mp3", 
            cover: "album.jpeg"
        };

        const audio = document.getElementById('audio-player');
        const coverImage = document.getElementById('cover-image');
        const trackInfo = document.getElementById('track-info');

        // Load setup
        function initTrack() {
            audio.src = trackData.audio;
            coverImage.src = trackData.cover;
            trackInfo.textContent = trackData.title;
        }

        // --- Audio Control Functional Logic ---

        // Play: Starts playing the track from its current position
        document.getElementById('play-btn').addEventListener('click', () => {
            audio.play().catch(e => console.log("Playback interaction handled."));
        });

        // Pause: Freezes the track at its current position without resetting
        document.getElementById('pause-btn').addEventListener('click', () => {
            audio.pause();
        });

        // Skip: Restarts the track from the beginning and forces replay
        document.getElementById('skip-btn').addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play().catch(e => {});
        });

        // Setup widget details on startup
        initTrack();

        // --- Drag and Drop Interface Framework ---
        const widget = document.getElementById('music-widget');
        let isDragging = false;
        let offsetX, offsetY;

        widget.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('btn-overlay')) return;
            
            isDragging = true;
            offsetX = e.clientX - widget.getBoundingClientRect().left;
            offsetY = e.clientY - widget.getBoundingClientRect().top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;

            // Restricts widget within the window frame limits
            x = Math.max(0, Math.min(x, window.innerWidth - widget.offsetWidth));
            y = Math.max(0, Math.min(y, window.innerHeight - widget.offsetHeight));

            widget.style.left = `${x}px`;
            widget.style.top = `${y}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
