<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111;
    }

    /* ── Full-screen wallpaper ── */
    #bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          135deg,
          rgba(30, 27, 75, 0.4) 0%,
          rgba(15, 23, 42, 0.4) 100%
        ),
        url('wallpaper.jpg') no-repeat center center;

      background-size: cover;
      filter: brightness(0.65) blur(2px);
      z-index: 0;
    }

    /* ── Floating Music Notes ── */
    #music-notes-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bg-note-wave {
      position: absolute;
      font-size: 42px;
      color: rgba(255,255,255,0.22);
      filter: blur(2px);
      opacity: 0;
      will-change: transform, opacity;
      user-select: none;

      text-shadow:
        0 0 12px rgba(255,255,255,0.18),
        0 0 24px rgba(255,255,255,0.10);
    }

    /* ── Zero-Lag Money Styles ── */
    #money-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      perspective: 500px;
    }

    .bill {
      position: absolute;
      width: 110px;
      height: 46px;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .bill-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 2px;
    }

    .bill-front {
      transform: rotateY(0deg);
    }

    .bill-back {
      transform: rotateY(180deg);
    }

    .bill-shard {
      position: absolute;
      width: 7px;
      height: 7px;
      background: #ff5500;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* ── Draggable player card ── */
    #player {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 340px;
      border-radius: 24px;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 32px 80px rgba(0,0,0,0.55);
      padding: 28px 28px 24px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    #player.dragging {
      cursor: grabbing;
      box-shadow: 0 48px 100px rgba(0,0,0,0.70);
    }

    /* Album art */
    #art-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #1a1a2e;
    }

    #art-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s;
    }

    #art-wrap img.fade-out {
      opacity: 0;
    }

    /* Vinyl spin ring animation */
    #vinyl-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.15);
      animation: spin 12s linear infinite;
      animation-play-state: paused;
      pointer-events: none;
    }

    #vinyl-ring.spinning {
      animation-play-state: running;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Song info */
    #song-title {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #song-artist {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress bar */
    #progress-wrap {
      margin: 16px 0 6px;
      cursor: pointer;
      padding: 4px 0;
    }

    #progress-bg {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      position: relative;
    }

    #progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #a78bfa, #6366f1);
      width: 0%;
    }

    #progress-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      left: 0%;
      transition: transform 0.1s;
    }

    #progress-wrap:hover #progress-thumb {
      transform: translate(-50%, -50%) scale(1.2);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    /* ── SVG controls ── */
    #controls-svg {
      width: 100%;
      margin-top: 8px;
      overflow: visible;
    }

    .btn-zone {
      cursor: pointer;
      fill: transparent;
      transition: fill 0.15s;
    }

    .btn-zone:hover {
      fill: rgba(255,255,255,0.08);
    }

    .btn-zone:active {
      fill: rgba(255,255,255,0.16);
    }

    .ctrl-icon {
      pointer-events: none;
      fill: rgba(255,255,255,0.9);
    }

    .ctrl-icon-sm {
      pointer-events: none;
      fill: rgba(255,255,255,0.6);
    }

    /* Volume */
    #vol-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding: 0 4px;
    }

    #vol-wrap svg {
      flex-shrink: 0;
    }

    #vol-slider {
      flex: 1;
      accent-color: #a78bfa;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    /* Toast notification */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 20, 25, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 13px;
      padding: 10px 22px;
      border-radius: 50px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 99;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

<div id="bg"></div>

<div id="music-notes-container"></div>
<div id="money-container"></div>

<div id="player">

  <div id="art-wrap">
    <img
      id="cover-img"
      src="album.jpeg"
      alt="Album Cover"
    />

    <div id="vinyl-ring"></div>
  </div>

  <div id="song-title">Loading…</div>
  <div id="song-artist">—</div>

  <div id="progress-wrap">
    <div id="progress-bg">
      <div id="progress-fill"></div>
      <div id="progress-thumb"></div>
    </div>
  </div>

  <div class="time-row">
    <span id="time-cur">0:00</span>
    <span id="time-dur">0:00</span>
  </div>

  <svg id="controls-svg" viewBox="0 0 284 60">

    <g id="btn-pause1">
      <rect class="btn-zone" x="14" y="8" width="52" height="44" rx="10"/>
      <rect class="ctrl-icon-sm" x="31" y="20" width="5" height="20" rx="1.5"/>
      <rect class="ctrl-icon-sm" x="42" y="20" width="5" height="20" rx="1.5"/>
    </g>

    <g id="btn-play">
      <rect class="btn-zone" x="116" y="2" width="52" height="56" rx="14"/>
      <polygon class="ctrl-icon" points="134,18 134,42 154,30"/>
    </g>

    <g id="btn-skip">
      <rect class="btn-zone" x="218" y="8" width="52" height="44" rx="10"/>
      <polygon class="ctrl-icon-sm" points="248,20 248,40 232,30"/>
      <rect class="ctrl-icon-sm" x="226" y="20" width="4" height="20" rx="1"/>
    </g>

  </svg>

  <div id="vol-wrap">

    <svg width="16" height="16" viewBox="0 0 16 16">
      <path d="M2 5.5h2.5L8 2.5v11L4.5 10.5H2v-5z"
        fill="rgba(255,255,255,0.6)"/>

      <path d="M11 5a3.5 3.5 0 0 1 0 6"
        stroke="rgba(255,255,255,0.6)"
        stroke-width="1.5"
        stroke-linecap="round"/>
    </svg>

    <input
      type="range"
      id="vol-slider"
      min="0"
      max="1"
      step="0.01"
      value="0.8"
    />

  </div>

</div>

<div id="toast"></div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>

  const SONGS = [
    {
      title: "Hate The Morning",
      artist: "Maxon Margiela",
      cover: "album.jpeg",
      src: "maxonmusic.mp3"
    }
  ];

  let idx = 0;
  let playing = false;

  const audio = document.getElementById('audio');
  const coverImg = document.getElementById('cover-img');
  const songTitle = document.getElementById('song-title');
  const songArtist = document.getElementById('song-artist');
  const progressWrap = document.getElementById('progress-wrap');
  const progressBg = document.getElementById('progress-bg');
  const progressFill = document.getElementById('progress-fill');
  const progressThumb = document.getElementById('progress-thumb');
  const timeCur = document.getElementById('time-cur');
  const timeDur = document.getElementById('time-dur');
  const vinylRing = document.getElementById('vinyl-ring');
  const volSlider = document.getElementById('vol-slider');
  const toast = document.getElementById('toast');

  let toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 1800);
  }

  function fmt(s) {
    if (isNaN(s) || s === Infinity) return '0:00';

    const mins = Math.floor(s / 60);
    const secs = Math.floor(s % 60);

    return mins + ':' + String(secs).padStart(2, '0');
  }

  function loadSong(i, autoplay) {

    const s = SONGS[i];
    if (!s) return;

    songTitle.textContent = s.title;
    songArtist.textContent = s.artist;

    audio.src = s.src;
    audio.volume = parseFloat(volSlider.value);

    if (autoplay) {

      audio.play()
        .then(() => setPlaying(true))
        .catch(() => setPlaying(false));

    } else {

      setPlaying(false);

    }
  }

  function setPlaying(state) {

    playing = state;

    if (state) {
      vinylRing.classList.add('spinning');
      updatePlayIcon(true);
    } else {
      vinylRing.classList.remove('spinning');
      updatePlayIcon(false);
    }
  }

  function updatePlayIcon(isPlaying) {

    const g = document.getElementById('btn-play');

    const oldIcons = g.querySelectorAll('.ctrl-icon');

    oldIcons.forEach(el => el.remove());

    if (isPlaying) {

      [['132', '6'], ['146', '6']].forEach(([xPos, width]) => {

        const r = document.createElementNS(
          'http://www.w3.org/2000/svg',
          'rect'
        );

        r.setAttribute('class', 'ctrl-icon');
        r.setAttribute('x', xPos);
        r.setAttribute('y', '19');
        r.setAttribute('width', width);
        r.setAttribute('height', '22');
        r.setAttribute('rx', '1.5');

        g.appendChild(r);

      });

    } else {

      const poly = document.createElementNS(
        'http://www.w3.org/2000/svg',
        'polygon'
      );

      poly.setAttribute('class', 'ctrl-icon');
      poly.setAttribute('points', '134,18 134,42 154,30');

      g.appendChild(poly);

    }
  }

  document.getElementById('btn-play')
    .addEventListener('click', () => {

      if (playing) {

        audio.pause();
        setPlaying(false);
        showToast('Paused');

      } else {

        audio.play()
          .then(() => {
            setPlaying(true);
            showToast('Playing');
          })
          .catch(() => showToast('Audio file not found / blocked'));

      }
    });

  /* ── Floating Music Notes Waves Engine ── */

  const notesContainer =
    document.getElementById('music-notes-container');

  const NOTE_CHARS = ['♪', '♫', '♩', '♬'];

  let activeNotes = [];

  function spawnNoteWave() {

    if (activeNotes.length >= 12) return;

    const el = document.createElement('div');

    el.className = 'bg-note-wave';

    el.textContent =
      NOTE_CHARS[Math.floor(Math.random() * NOTE_CHARS.length)];

    const size = 30 + Math.random() * 36;

    el.style.fontSize = size + 'px';

    let xPos = Math.random() * window.innerWidth;
    let yPos = window.innerHeight + 80;

    let floatSpeed = 0.4 + Math.random() * 0.7;

    let waveSeed = Math.random() * 100;
    let waveSpeed = 0.008 + Math.random() * 0.01;
    let waveAmount = 12 + Math.random() * 18;

    let opacity = 0;
    let maxOpacity = 0.10 + Math.random() * 0.18;

    let scale = 0.8 + Math.random() * 0.6;

    notesContainer.appendChild(el);

    activeNotes.push({
      element: el,
      x: xPos,
      y: yPos,
      floatSpeed,
      waveSeed,
      waveSpeed,
      waveAmount,
      opacity,
      maxOpacity,
      scale,
      fadingIn: true
    });
  }

  function updateNotesEngine() {

    for (let i = activeNotes.length - 1; i >= 0; i--) {

      const n = activeNotes[i];

      n.y -= n.floatSpeed;

      n.waveSeed += n.waveSpeed;

      const waveX =
        Math.sin(n.waveSeed) * n.waveAmount;

      if (n.fadingIn) {

        n.opacity += 0.004;

        if (n.opacity >= n.maxOpacity) {

          n.opacity = n.maxOpacity;
          n.fadingIn = false;

        }
      }

      if (n.y < window.innerHeight * 0.28) {
        n.opacity -= 0.002;
      }

      n.element.style.opacity = n.opacity;

      n.element.style.transform =
        `translate3d(${n.x + waveX}px, ${n.y}px, 0)
         scale(${n.scale})`;

      if (n.y < -120 || n.opacity <= 0) {

        n.element.remove();

        activeNotes.splice(i, 1);

      }
    }

    requestAnimationFrame(updateNotesEngine);
  }

  setInterval(spawnNoteWave, 900);

  for (let i = 0; i < 6; i++) {
    spawnNoteWave();
  }

  requestAnimationFrame(updateNotesEngine);

  loadSong(idx, false);

</script>

</body>
</html>
