<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palm Beach Waves</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 30%, #7000ff 70%, #1f005c 100%);
        }

        /* Ambient Synthwave/Palm Beach overlay grid for depth */
        #canvas::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Handle resizing
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Mouse tracking
        const mouse = {
            x: null,
            y: null,
            radius: 80 // Hover detection radius
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Musical note symbols to render
        const noteSymbols = ['♪', '♫', '♩', '♬', '♭', '♮', '♯'];

        // Particle Class (for explosions)
        class Particle {
            constructor(x, y, symbol, color) {
                this.x = x;
                this.y = y;
                this.symbol = symbol;
                this.size = Math.random() * 16 + 12;
                this.speedX = (Math.random() - 0.5) * 10;
                this.speedY = (Math.random() - 0.5) * 10;
                this.gravity = 0.05;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
                this.angle += this.spin;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + this.alpha + ')';
                // Soft glow effect for the explosion
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fff';
                ctx.font = `${this.size}px sans-serif`;
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        // Wave Node Class
        class WaveNode {
            constructor(x, y, symbol, baseRowY) {
                this.x = x;
                this.y = y;
                this.baseRowY = baseRowY; // Track its original baseline
                this.symbol = symbol;
                this.size = Math.random() * 14 + 12;
                this.isExploded = false;
                this.angle = Math.random() * Math.PI;
            }

            update(time, waveIndex) {
                if (this.isExploded) return;

                // Flowing oscillation logic
                // Creates a natural snake/wave movement combining time and x-position
                this.y = this.baseRowY + Math.sin(time * 0.002 + this.x * 0.005 + waveIndex) * 40;
                
                // Add a gentle floating rotation
                this.angle += 0.01;

                // Check collision with mouse
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius) {
                        this.explode();
                    }
                }
            }

            explode() {
                this.isExploded = true;
                // Create a burst of smaller debris particles when the node dies
                for (let i = 0; i < 6; i++) {
                    particles.push(new Particle(this.x, this.y, this.symbol));
                }
            }

            draw() {
                if (this.isExploded) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.angle) * 0.3); // rocking motion
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                ctx.font = `${this.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        // Setup the Scene
        const wavesCount = 5;
        let waveRows = [];
        let particles = [];

        function initWaves() {
            waveRows = [];
            particles = [];
            const spacingX = 35; // Horizontal gap between notes
            
            for (let w = 0; w < wavesCount; w++) {
                let nodes = [];
                // Distribute wave baselines evenly across the height of screen
                let baseRowY = (canvas.height / (wavesCount + 1)) * (w + 1);
                
                for (let x = 0; x < canvas.width + spacingX; x += spacingX) {
                    const randomSymbol = noteSymbols[Math.floor(Math.random() * noteSymbols.length)];
                    nodes.push(new WaveNode(x, baseRowY, randomSymbol, baseRowY));
                }
                waveRows.push(nodes);
            }
        }

        // Ambient Sun Graphic (Classic Palm Beach Synthwave trope)
        function drawSun() {
            const sunX = canvas.width / 2;
            const sunY = canvas.height * 0.45;
            const radius = Math.min(canvas.width, canvas.height) * 0.25;

            ctx.save();
            let gradient = ctx.createLinearGradient(sunX, sunY - radius, sunX, sunY + radius);
            gradient.addColorStop(0, '#ffbd59');
            gradient.addColorStop(0.5, '#ff5e62');
            gradient.addColorStop(1, '#ff3366');

            ctx.fillStyle = gradient;
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff5e62';
            
            ctx.beginPath();
            ctx.arc(sunX, sunY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Main Animation Loop
        function animate(timestamp) {
            // Draw background gradient implicitly via canvas clear/opacity overlay
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw retro sun aesthetic backdrop
            drawSun();

            // Process and draw wave notes
            for (let w = 0; w < waveRows.length; w++) {
                let nodes = waveRows[w];
                for (let i = 0; i < nodes.length; i++) {
                    nodes[i].update(timestamp, w);
                    nodes[i].draw();
                }
            }

            // Process and draw explosion particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                // Performance optimization: remove dead particles
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Periodically regenerate exploded nodes so screen doesn't go empty
            regenerateNodes();

            requestAnimationFrame(animate);
        }

        function regenerateNodes() {
            for (let w = 0; w < waveRows.length; w++) {
                let nodes = waveRows[w];
                for (let i = 0; i < nodes.length; i++) {
                    if (nodes[i].isExploded && Math.random() < 0.002) { // gradual respawn rate
                        const randomSymbol = noteSymbols[Math.floor(Math.random() * noteSymbols.length)];
                        nodes[i] = new WaveNode(nodes[i].x, nodes[i].baseRowY, randomSymbol, nodes[i].baseRowY);
                    }
                }
            }
        }

        // Initialize and Run
        initWaves();
        requestAnimationFrame(animate);

        // Re-initialize on resize to fix spacing layout dynamically
        window.addEventListener('resize', initWaves);

    </script>
</body>
</html>
